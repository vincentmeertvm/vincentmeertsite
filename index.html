<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vincent Meert</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #7b3fe4;
      transition: background-color 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      cursor: grab;
    }

    body.dragging {
      cursor: grabbing;
    }

    body.shattered {
      cursor: pointer;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    let W = window.innerWidth;
    let H = window.innerHeight;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    // ---------------------------------------------------------
    // 1. CURATED BACKGROUND COLOR PALETTE & RING TEXT
    // ---------------------------------------------------------
    const BG_PALETTE = [
      '#7b3fe4', // Electric Violet
      '#2563eb', // Cobalt Blue
      '#ff4d2d', // International Orange
      '#059669', // Deep Emerald
      '#db2777', // Vibrant Magenta
      '#4f46e5', // Ultramarine Indigo
      '#d97706', // Warm Amber
      '#0d9488', // Deep Teal
      '#e11d48', // Crimson Rose
      '#1e293b'  // Midnight Slate
    ];
    let currentColorIdx = 0;

    function cycleBackgroundColor() {
      let nextIdx = currentColorIdx;
      while (nextIdx === currentColorIdx) {
        nextIdx = Math.floor(Math.random() * BG_PALETTE.length);
      }
      currentColorIdx = nextIdx;
      document.body.style.backgroundColor = BG_PALETTE[currentColorIdx];
    }

    const RING_TEXT = "vincent meert drives growth in tech & ai. previously, he worked across automotive ict & more   ";
    const NUM_NODES = RING_TEXT.length;
    const BASE_RADIUS = Math.min(W, H) < 600 ? 115 : 150;
    const GRAVITY = 0.55; // Constant downward gravity

    // ---------------------------------------------------------
    // 2. WEB AUDIO SYNTH (BOUNCE & SHATTER)
    // ---------------------------------------------------------
    let audioCtx = null;
    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBounceSound(intensity) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const vol = Math.min(0.4, Math.max(0.03, intensity / 24));

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(105 + intensity * 4, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.13);

      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.14);
    }

    function playShatterSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const bufferSize = audioCtx.sampleRate * 0.16;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.28));
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1850, now);
      filter.Q.setValueAtTime(1.8, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.45, now);
      gain.gain.exponentialRampToValueAtTime(0.005, now + 0.16);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);

      playBounceSound(18);
    }

    // ---------------------------------------------------------
    // 3. BALL STATE & PRE-INITIALIZED PERIMETER NODES
    // ---------------------------------------------------------
    const ball = {
      x: W * 0.5,
      y: H * 0.42,     // Starts in middle of page and drops to bottom on load
      vx: 1.2,         // Slight horizontal drift so initial drop rolls & spins nicely
      vy: 0,
      radius: BASE_RADIUS,
      angle: -0.5,
      omega: 0.018,    // Initial gentle spin on drop
      isDragging: false,
      dragOffsetX: 0,
      dragOffsetY: 0,
      lastWallHit: 0,
      wasTouchingEdge: false,
      strain: 0,
      state: 'intact', // 'intact' | 'shattered' | 'reforming'
      reformStart: 0,
      nodes: []
    };

    for (let i = 0; i < NUM_NODES; i++) {
      const theta = ball.angle + (i / NUM_NODES) * Math.PI * 2;
      ball.nodes.push({
        char: RING_TEXT[i],
        rOffset: 0,
        rVel: 0,
        wx: ball.x + Math.cos(theta) * BASE_RADIUS,
        wy: ball.y + Math.sin(theta) * BASE_RADIUS,
        wAngle: theta + Math.PI * 0.5,
        vx: 0,
        vy: 0,
        vRot: 0
      });
    }

    // ---------------------------------------------------------
    // 4. POINTER INTERACTION, SPIN TORQUE & CLICK-TO-RESPAWN
    // ---------------------------------------------------------
    const pointer = {
      x: W * 0.5,
      y: H * 0.5,
      px: W * 0.5,
      py: H * 0.5,
      vx: 0,
      vy: 0,
      down: false
    };

    // Mouse wheel / trackpad scroll also spins the text ring so it's always easy to read
    window.addEventListener('wheel', (e) => {
      if (ball.state === 'intact') {
        ball.omega += (e.deltaY + e.deltaX) * 0.00018;
        ball.omega = Math.max(-0.22, Math.min(0.22, ball.omega));
      }
    }, { passive: true });

    window.addEventListener('pointerdown', (e) => {
      unlockAudio();
      pointer.down = true;
      pointer.x = pointer.px = e.clientX;
      pointer.y = pointer.py = e.clientY;

      // If ball is popped/shattered, clicking anywhere respawns it at cursor and drops it
      if (ball.state === 'shattered') {
        const margin = ball.radius + 16;
        ball.x = Math.max(margin, Math.min(W - margin, e.clientX));
        ball.y = Math.max(margin, Math.min(H - margin, e.clientY));
        ball.vx = (Math.random() - 0.5) * 3;
        ball.vy = 0;
        ball.omega = 0.025;
        ball.state = 'reforming';
        ball.reformStart = performance.now();
        document.body.classList.remove('shattered');
        playBounceSound(10);
        return;
      }

      if (ball.state !== 'intact') return;

      const dist = Math.hypot(pointer.x - ball.x, pointer.y - ball.y);
      if (dist <= ball.radius * 1.25) {
        ball.isDragging = true;
        ball.dragOffsetX = ball.x - pointer.x;
        ball.dragOffsetY = ball.y - pointer.y;
        ball.vx = 0;
        ball.vy = 0;
        document.body.classList.add('dragging');
      }
    });

    window.addEventListener('pointermove', (e) => {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
    });

    window.addEventListener('pointerup', () => {
      pointer.down = false;
      if (ball.isDragging) {
        ball.isDragging = false;
        document.body.classList.remove('dragging');

        // Transfer linear throw velocity
        ball.vx = Math.max(-36, Math.min(36, pointer.vx * 0.85));
        ball.vy = Math.max(-36, Math.min(36, pointer.vy * 0.85));

        // Impart generous rotational torque from the flick vector so the wheel spins & stays readable
        const rx = pointer.x - ball.x;
        const ry = pointer.y - ball.y;
        const crossTorque = (rx * pointer.vy - ry * pointer.vx) / (ball.radius * ball.radius);
        const horizontalSpin = pointer.vx / (ball.radius * 0.85);
        ball.omega += crossTorque * 0.55 + horizontalSpin * 0.35;
        ball.omega = Math.max(-0.22, Math.min(0.22, ball.omega));
      }
    });

    // ---------------------------------------------------------
    // 5. POP / SHATTER THE BALL OF TEXT
    // ---------------------------------------------------------
    function triggerBallCrackOpen() {
      ball.state = 'shattered';
      ball.isDragging = false;
      ball.strain = 0;
      ball.vx = 0;
      ball.vy = 0;
      ball.omega = 0;
      document.body.classList.remove('dragging');
      document.body.classList.add('shattered');

      playShatterSound();
      cycleBackgroundColor();

      const burstX = ball.x;
      const burstY = ball.y;

      for (let i = 0; i < NUM_NODES; i++) {
        const n = ball.nodes[i];
        const dx = n.wx - burstX;
        const dy = n.wy - burstY;
        const dist = Math.hypot(dx, dy) || 1;
        const nx = dx / dist;
        const ny = dy / dist;

        const popSpeed = 6 + Math.random() * 14;
        n.vx = nx * popSpeed + (Math.random() - 0.5) * 8;
        n.vy = ny * popSpeed + (Math.random() - 0.5) * 8 - 4;
        n.vRot = (Math.random() - 0.5) * 0.28;
        n.rOffset = 0;
        n.rVel = 0;
      }
    }

    // ---------------------------------------------------------
    // 6. PHYSICS STEP (GRAVITY, BOUNCE, SPIN & INDENTATION)
    // ---------------------------------------------------------
    function updatePhysics(now) {
      pointer.vx = pointer.x - pointer.px;
      pointer.vy = pointer.y - pointer.py;
      pointer.px = pointer.x;
      pointer.py = pointer.y;

      // STATE 1: SHATTERED (WAITS UNTIL USER CLICKS)
      if (ball.state === 'shattered') {
        const pad = 12;
        for (let i = 0; i < NUM_NODES; i++) {
          const n = ball.nodes[i];
          n.vy += 0.38; // Gravity on shattered letters
          n.vx *= 0.985;
          n.vy *= 0.985;
          n.wx += n.vx;
          n.wy += n.vy;
          n.wAngle += n.vRot;

          if (n.wx < pad) { n.wx = pad; n.vx = Math.abs(n.vx) * 0.7; }
          if (n.wx > W - pad) { n.wx = W - pad; n.vx = -Math.abs(n.vx) * 0.7; }
          if (n.wy < pad) { n.wy = pad; n.vy = Math.abs(n.vy) * 0.7; }
          if (n.wy > H - pad) {
            n.wy = H - pad;
            n.vy = -Math.abs(n.vy) * 0.55;
            n.vx *= 0.88;
            n.vRot *= 0.85;
            if (Math.abs(n.vy) < 0.4) n.vy = 0;
          }
        }
        return;
      }

      // STATE 2: REFORMING AFTER USER CLICK
      if (ball.state === 'reforming') {
        const duration = 0.5;
        const elapsed = Math.max(0, (now - ball.reformStart) / 1000);
        const t = Math.min(1, elapsed / duration);
        const ease = 1 - Math.pow(1 - t, 3);

        for (let i = 0; i < NUM_NODES; i++) {
          const n = ball.nodes[i];
          const theta = ball.angle + (i / NUM_NODES) * Math.PI * 2;
          const targetX = ball.x + Math.cos(theta) * ball.radius;
          const targetY = ball.y + Math.sin(theta) * ball.radius;
          const targetAngle = theta + Math.PI * 0.5;

          n.wx += (targetX - n.wx) * (0.16 + ease * 0.36);
          n.wy += (targetY - n.wy) * (0.16 + ease * 0.36);

          let diff = ((targetAngle - n.wAngle) % (Math.PI * 2));
          if (diff > Math.PI) diff -= Math.PI * 2;
          if (diff < -Math.PI) diff += Math.PI * 2;
          n.wAngle += diff * (0.18 + ease * 0.36);

          n.rOffset = 0;
          n.rVel = 0;
        }

        if (t >= 1) {
          ball.state = 'intact';
        }
        return;
      }

      // STATE 3: INTACT BALL WITH GRAVITY & ENHANCED SPIN
      const canTriggerWallColor = (now - ball.lastWallHit) > 120;

      if (ball.isDragging) {
        const targetX = pointer.x + ball.dragOffsetX;
        const targetY = pointer.y + ball.dragOffsetY;
        ball.vx = (targetX - ball.x) * 0.42;
        ball.vy = (targetY - ball.y) * 0.42;
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Spin the wheel actively while dragging it around or whipping the cursor
        const rx = pointer.x - ball.x;
        const ry = pointer.y - ball.y;
        const dragTorque = (rx * pointer.vy - ry * pointer.vx) / (ball.radius * ball.radius);
        ball.omega = ball.omega * 0.92 + dragTorque * 0.28 + (ball.vx / ball.radius) * 0.14;
        ball.omega = Math.max(-0.22, Math.min(0.22, ball.omega));

        const touchingEdge =
          ball.x - ball.radius <= 0 ||
          ball.x + ball.radius >= W ||
          ball.y - ball.radius <= 0 ||
          ball.y + ball.radius >= H;

        if (touchingEdge && !ball.wasTouchingEdge && canTriggerWallColor) {
          cycleBackgroundColor();
          playBounceSound(8);
          ball.lastWallHit = now;
        }
        ball.wasTouchingEdge = touchingEdge;
      } else {
        ball.wasTouchingEdge = false;

        // Apply downward gravity so the wheel always falls & lands on the bottom
        ball.vy += GRAVITY;

        ball.x += ball.vx;
        ball.y += ball.vy;

        // Low angular damping so the wheel keeps spinning smoothly to read the text
        ball.vx *= 0.995;
        ball.omega *= 0.9965;

        // Left Wall Bounce + Spin Transfer
        if (ball.x - ball.radius <= 0) {
          ball.x = ball.radius;
          if (ball.vx < 0) {
            const impact = Math.abs(ball.vx);
            ball.vx = Math.abs(ball.vx) * 0.82;
            // Wall friction converts vertical motion + impact into spin
            ball.omega += (ball.vy * 0.0022) + (impact * 0.003);
            if (canTriggerWallColor && impact > 1.2) {
              cycleBackgroundColor();
              playBounceSound(impact);
              ball.lastWallHit = now;
            }
          }
        }
        // Right Wall Bounce + Spin Transfer
        else if (ball.x + ball.radius >= W) {
          ball.x = W - ball.radius;
          if (ball.vx > 0) {
            const impact = Math.abs(ball.vx);
            ball.vx = -Math.abs(ball.vx) * 0.82;
            ball.omega += (-ball.vy * 0.0022) - (impact * 0.003);
            if (canTriggerWallColor && impact > 1.2) {
              cycleBackgroundColor();
              playBounceSound(impact);
              ball.lastWallHit = now;
            }
          }
        }

        // Ceiling Bounce
        if (ball.y - ball.radius <= 0) {
          ball.y = ball.radius;
          if (ball.vy < 0) {
            const impact = Math.abs(ball.vy);
            ball.vy = Math.abs(ball.vy) * 0.78;
            ball.omega += -ball.vx * 0.0025;
            if (canTriggerWallColor && impact > 1.2) {
              cycleBackgroundColor();
              playBounceSound(impact);
              ball.lastWallHit = now;
            }
          }
        }
        // Bottom Floor Landing, Bouncing & Rolling Spin
        else if (ball.y + ball.radius >= H) {
          ball.y = H - ball.radius;

          if (ball.vy > 0) {
            const impact = Math.abs(ball.vy);

            // Bounce up if falling fast enough; otherwise settle onto the floor
            if (impact > 1.8) {
              ball.vy = -impact * 0.68; // Bouncy landing on load & drops
              // Convert bounce energy + existing spin into rolling motion & fresh spin
              ball.vx += ball.omega * ball.radius * 0.18;
              ball.omega += (ball.vx / ball.radius) * 0.35 + (impact * 0.0025 * (ball.omega >= 0 ? 1 : -1));

              if (canTriggerWallColor && impact > 2.4) {
                cycleBackgroundColor();
                playBounceSound(impact);
                ball.lastWallHit = now;
              }
            } else {
              ball.vy = 0;
            }
          }

          // When rolling along the floor, couple horizontal speed and wheel spin
          ball.vx *= 0.985;
          const targetRollOmega = (ball.vx / ball.radius) * 1.35;
          if (Math.abs(ball.vx) > 0.15) {
            ball.omega += (targetRollOmega - ball.omega) * 0.12;
          } else {
            ball.vx = 0;
            // Let residual spin coast smoothly even after horizontal movement stops
            ball.omega *= 0.992;
          }
        }

        if (Math.abs(ball.omega) < 0.00015 && Math.abs(ball.vx) < 0.05) {
          ball.omega = 0;
        }
      }

      ball.angle += ball.omega;

      // ---------------------------------------------------------
      // INDENTATION SOLVER (ONLY INDENTS WHEN HELD OVER THE FRAME)
      // ---------------------------------------------------------
      let totalCrush = 0;
      let maxNodeCrush = 0;
      const wallPad = 8;

      for (let i = 0; i < NUM_NODES; i++) {
        const node = ball.nodes[i];
        const theta = ball.angle + (i / NUM_NODES) * Math.PI * 2;
        const cosT = Math.cos(theta);
        const sinT = Math.sin(theta);

        const idealR = ball.radius;
        let currentR = idealR + node.rOffset;

        if (ball.isDragging) {
          const wx = ball.x + cosT * currentR;
          const wy = ball.y + sinT * currentR;

          let allowedR = currentR;
          if (wx < wallPad && cosT < -0.02) {
            allowedR = Math.min(allowedR, (wallPad - ball.x) / cosT);
          }
          if (wx > W - wallPad && cosT > 0.02) {
            allowedR = Math.min(allowedR, (W - wallPad - ball.x) / cosT);
          }
          if (wy < wallPad && sinT < -0.02) {
            allowedR = Math.min(allowedR, (wallPad - ball.y) / sinT);
          }
          if (wy > H - wallPad && sinT > 0.02) {
            allowedR = Math.min(allowedR, (H - wallPad - ball.y) / sinT);
          }

          const idealUnclampedX = ball.x + cosT * idealR;
          const idealUnclampedY = ball.y + sinT * idealR;
          const overLeft = Math.max(0, wallPad - idealUnclampedX);
          const overRight = Math.max(0, idealUnclampedX - (W - wallPad));
          const overTop = Math.max(0, wallPad - idealUnclampedY);
          const overBottom = Math.max(0, idealUnclampedY - (H - wallPad));
          const rawCrush = Math.max(overLeft, overRight, overTop, overBottom);

          if (rawCrush > 0) {
            totalCrush += rawCrush;
            if (rawCrush > maxNodeCrush) maxNodeCrush = rawCrush;
          }

          if (allowedR < currentR) {
            node.rOffset = Math.max(-idealR * 0.78, allowedR - idealR);
            node.rVel *= 0.35;
          }
        }

        // Spring back to a pure circle
        const springK = 0.22;
        const damping = 0.76;
        node.rVel += -node.rOffset * springK;
        node.rVel *= damping;
        node.rOffset += node.rVel;
      }

      // Smooth neighbor coupling & subtle side bulge while held against the frame
      if (ball.isDragging && totalCrush > 0) {
        const bulge = Math.min(32, (totalCrush / NUM_NODES) * 0.75);
        for (let i = 0; i < NUM_NODES; i++) {
          const prev = ball.nodes[(i - 1 + NUM_NODES) % NUM_NODES];
          const next = ball.nodes[(i + 1) % NUM_NODES];
          const curr = ball.nodes[i];

          const neighborAvg = (prev.rOffset + next.rOffset) * 0.5;
          curr.rVel += (neighborAvg - curr.rOffset) * 0.3;
          if (curr.rOffset >= -1) {
            curr.rOffset += bulge * 0.075;
          }
        }
      }

      // Update world coordinates & tangent angles
      for (let i = 0; i < NUM_NODES; i++) {
        const theta = ball.angle + (i / NUM_NODES) * Math.PI * 2;
        const r = ball.radius + (ball.nodes[i].rOffset || 0);
        ball.nodes[i].wx = ball.x + Math.cos(theta) * r;
        ball.nodes[i].wy = ball.y + Math.sin(theta) * r;
      }

      for (let i = 0; i < NUM_NODES; i++) {
        const prev = ball.nodes[(i - 1 + NUM_NODES) % NUM_NODES];
        const next = ball.nodes[(i + 1) % NUM_NODES];
        ball.nodes[i].wAngle = Math.atan2(next.wy - prev.wy, next.wx - prev.wx);
      }

      // Check if user pushed hard enough into the frame to pop the ball open
      const crushRatio = maxNodeCrush / ball.radius;
      if (ball.isDragging && crushRatio > 0.42) {
        ball.strain += (crushRatio - 0.38) * 0.085;
        if (crushRatio > 0.68 || ball.strain >= 1.0) {
          triggerBallCrackOpen();
        }
      } else {
        ball.strain = Math.max(0, ball.strain - 0.05);
      }
    }

    // ---------------------------------------------------------
    // 7. RENDER LOOP
    // ---------------------------------------------------------
    function render(now) {
      updatePhysics(now || performance.now());

      ctx.clearRect(0, 0, W, H);

      const fontSize = Math.min(W, H) < 600 ? 15 : 19;
      ctx.font = `500 ${fontSize}px -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", sans-serif`;
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < NUM_NODES; i++) {
        const n = ball.nodes[i];
        if (!Number.isFinite(n.wx) || !Number.isFinite(n.wy)) continue;

        let jitterX = 0;
        let jitterY = 0;
        let jitterRot = 0;
        if (ball.state === 'intact' && ball.strain > 0.15) {
          const mag = ball.strain * 3.5;
          jitterX = (Math.random() - 0.5) * mag;
          jitterY = (Math.random() - 0.5) * mag;
          jitterRot = (Math.random() - 0.5) * (ball.strain * 0.18);
        }

        ctx.save();
        ctx.translate(n.wx + jitterX, n.wy + jitterY);
        ctx.rotate((n.wAngle || 0) + jitterRot);
        ctx.fillText(n.char, 0, 0);
        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
