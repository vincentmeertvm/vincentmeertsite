<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vincent Meert</title>
  <style>
    :root {
      --bg: #fafafa;
      --fg: #171717;
      --muted: #8e8e93;
      --border: rgba(0, 0, 0, 0.08);
      --surface: rgba(255, 255, 255, 0.85);
      --accent: #000000;
      --font: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      --mono: "SF Mono", ui-monospace, Menlo, Monaco, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d0d;
        --fg: #f5f5f7;
        --muted: #7c7c82;
        --border: rgba(255, 255, 255, 0.1);
        --surface: rgba(24, 24, 26, 0.85);
        --accent: #ffffff;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      cursor: none;
      touch-action: none;
    }

    /* Physics Canvas */
    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Centered Name & Links (Acts as physical collider) */
    .center-stage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    #name-box {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.01em;
      padding: 10px 18px;
      border-radius: 999px;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform;
      cursor: none;
    }

    .links-row {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .links-row a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s ease;
      cursor: none;
    }

    .links-row a:hover {
      color: var(--fg);
    }

    /* Top HUD (:15 & Score) */
    .top-hud {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--muted);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .top-hud.visible {
      opacity: 1;
    }

    .timer-badge {
      color: var(--fg);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .score-badge {
      font-variant-numeric: tabular-nums;
    }

    /* Floating +1 */
    .plus-one {
      position: fixed;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
      pointer-events: none;
      z-index: 10;
      animation: popUp 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes popUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.85); }
      100% { opacity: 0; transform: translate(-50%, -28px) scale(1.1); }
    }

    /* Bottom Bar */
    .bottom-bar {
      position: fixed;
      bottom: 24px;
      left: 28px;
      right: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      font-size: 12px;
      color: var(--muted);
      pointer-events: none;
    }

    .pill-btn {
      pointer-events: auto;
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: none;
      transition: color 0.15s, border-color 0.15s, transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .pill-btn:hover {
      color: var(--fg);
      border-color: var(--muted);
      transform: scale(1.04);
    }

    .pill-btn:active {
      transform: scale(0.96);
    }

    #sound-hint {
      transition: opacity 0.3s ease;
    }

    /* Game Tuning Popover (goal size, puck friction) */
    .popover {
      position: fixed;
      bottom: 64px;
      right: 28px;
      width: 240px;
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      z-index: 15;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      transform: translateY(8px) scale(0.96);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .popover.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .slider-label span:last-child {
      color: var(--fg);
      font-family: var(--mono);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--fg);
      cursor: none;
      transition: transform 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .popover-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 4px;
      border-top: 1px solid var(--border);
    }

    .text-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      font-family: var(--font);
      cursor: none;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }

    .text-btn:hover {
      color: var(--fg);
      background: var(--border);
    }

    /* Post-Game & Leaderboard Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 290px;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transform: scale(0.94);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-backdrop.open .modal-card {
      transform: scale(1);
    }

    .modal-header {
      text-align: center;
    }

    .modal-score-big {
      font-size: 20px;
      font-weight: 600;
      color: var(--fg);
    }

    .modal-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .sign-form {
      display: flex;
      gap: 6px;
    }

    .sign-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      color: var(--fg);
      font-family: var(--mono);
      font-size: 12px;
      text-transform: uppercase;
      outline: none;
    }

    .sign-input::placeholder {
      text-transform: none;
      color: var(--muted);
      font-family: var(--font);
    }

    .lb-section-title {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .lb-rows {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: var(--mono);
      font-size: 12px;
      max-height: 150px;
      overflow-y: auto;
    }

    .lb-row {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
    }

    .lb-row.me {
      color: var(--fg);
      font-weight: 600;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <!-- Top Timer & Goal Counter -->
  <div class="top-hud" id="top-hud">
    <span class="timer-badge" id="timer-text">:15</span>
    <span class="score-badge" id="score-text">0 goals</span>
  </div>

  <!-- Minimalist Center Stage -->
  <div class="center-stage">
    <div id="name-box">Vincent Meert</div>
    <div class="links-row">
      <a href="mailto:vincent@meert.cc">email</a>
      <a href="https://linkedin.com" target="_blank" rel="noopener">linkedin</a>
    </div>
  </div>

  <!-- Leaderboard / Post-Game Modal -->
  <div class="modal-backdrop" id="lb-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-score-big" id="final-goals-text">0 goals</div>
        <div class="modal-sub">in 15 seconds</div>
      </div>

      <form class="sign-form" id="sign-form">
        <input
          type="text"
          id="initials-input"
          class="sign-input"
          maxlength="3"
          placeholder="sign with your initials"
          required
        />
        <button type="submit" class="pill-btn">sign</button>
      </form>

      <div>
        <div class="lb-section-title">
          <span>leaderboard</span>
          <span>goals</span>
        </div>
        <ul class="lb-rows" id="lb-rows"></ul>
      </div>

      <div class="modal-footer">
        <button class="text-btn" id="play-again-btn">play again</button>
        <button class="text-btn" id="done-btn">done</button>
      </div>
    </div>
  </div>

  <!-- Game Settings Popover -->
  <div class="popover" id="game-popover">
    <div class="slider-group">
      <div class="slider-label">
        <span>goal size</span>
        <span id="goal-size-label">2×</span>
      </div>
      <input type="range" id="goal-size-slider" min="1" max="4" step="0.5" value="2" />
    </div>

    <div class="slider-group">
      <div class="slider-label">
        <span>puck friction</span>
        <span id="friction-label">4.0%</span>
      </div>
      <input type="range" id="friction-slider" min="0.5" max="10" step="0.5" value="4.0" />
    </div>

    <div class="popover-actions">
      <button class="text-btn" id="reset-settings-btn">reset</button>
      <button class="text-btn" id="save-settings-btn">save</button>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <button class="pill-btn" id="open-lb-pill">leaderboard</button>
    <span id="sound-hint">tap anywhere for sound</span>
    <button class="pill-btn" id="game-btn">game</button>
  </div>

  <!-- 2D Air Hockey / Bounce Canvas -->
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const nameBox = document.getElementById('name-box');
    const topHud = document.getElementById('top-hud');
    const timerText = document.getElementById('timer-text');
    const scoreText = document.getElementById('score-text');
    const soundHint = document.getElementById('sound-hint');

    const gameBtn = document.getElementById('game-btn');
    const gamePopover = document.getElementById('game-popover');
    const goalSizeSlider = document.getElementById('goal-size-slider');
    const goalSizeLabel = document.getElementById('goal-size-label');
    const frictionSlider = document.getElementById('friction-slider');
    const frictionLabel = document.getElementById('friction-label');
    const resetSettingsBtn = document.getElementById('reset-settings-btn');
    const saveSettingsBtn = document.getElementById('save-settings-btn');

    const lbModal = document.getElementById('lb-modal');
    const openLbPill = document.getElementById('open-lb-pill');
    const finalGoalsText = document.getElementById('final-goals-text');
    const signForm = document.getElementById('sign-form');
    const initialsInput = document.getElementById('initials-input');
    const lbRows = document.getElementById('lb-rows');
    const playAgainBtn = document.getElementById('play-again-btn');
    const doneBtn = document.getElementById('done-btn');

    let W = window.innerWidth;
    let H = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    // Web Audio API Sound Engine
    let audioCtx = null;
    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        soundHint.style.opacity = '0';
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    window.addEventListener('pointerdown', unlockAudio);

    function playTone(freq, duration, type = 'sine', gainVal = 0.18) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.45, now + duration);

      gain.gain.setValueAtTime(Math.min(0.35, gainVal), now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration);
    }

    function playGoalChime() {
      if (!audioCtx) return;
      playTone(587.33, 0.12, 'triangle', 0.22); // D5
      setTimeout(() => playTone(880, 0.22, 'triangle', 0.25), 70); // A5
    }

    // Tunable Game Parameters (matches iansilber.com defaults)
    let goalMultiplier = 2.0;
    let baseGoalWidth = 90;
    let puckFriction = 0.04; // 4.0% per 60fps tick normalized

    // Entities
    const puck = {
      x: W * 0.5,
      y: H * 0.32,
      vx: 0,
      vy: 0,
      r: 13,
      scaleX: 1,
      scaleY: 1
    };

    const cursor = {
      x: W * 0.5,
      y: H * 0.7,
      px: W * 0.5,
      py: H * 0.7,
      vx: 0,
      vy: 0,
      r: 16
    };

    const goalPosts = {
      y: 28,
      postRadius: 5,
      netDepth: 18,
      netBounce: 0
    };

    // 15-Second Game Loop State
    let sprintActive = false;
    let timeLeft = 15.0;
    let goals = 0;
    let lastTime = performance.now();

    let scores = JSON.parse(localStorage.getItem('vm_silber_lb') || JSON.stringify([
      { name: 'VM', goals: 9 },
      { name: 'IAN', goals: 7 },
      { name: 'SAM', goals: 5 },
      { name: 'LEO', goals: 3 }
    ]));

    // Pointer tracking
    window.addEventListener('pointermove', (e) => {
      cursor.x = e.clientX;
      cursor.y = e.clientY;
    });

    // Settings Popover Controls
    gameBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      gamePopover.classList.toggle('open');
    });

    goalSizeSlider.addEventListener('input', (e) => {
      goalMultiplier = parseFloat(e.target.value);
      goalSizeLabel.textContent = `${goalMultiplier}×`;
    });

    frictionSlider.addEventListener('input', (e) => {
      const pct = parseFloat(e.target.value);
      frictionLabel.textContent = `${pct.toFixed(1)}%`;
      puckFriction = pct / 100;
    });

    resetSettingsBtn.addEventListener('click', () => {
      goalMultiplier = 2.0;
      puckFriction = 0.04;
      goalSizeSlider.value = '2';
      frictionSlider.value = '4.0';
      goalSizeLabel.textContent = '2×';
      frictionLabel.textContent = '4.0%';
      resetPuck();
    });

    saveSettingsBtn.addEventListener('click', () => {
      gamePopover.classList.remove('open');
    });

    function resetPuck() {
      puck.x = W * 0.5;
      puck.y = H * 0.32;
      puck.vx = 0;
      puck.vy = 0;
    }

    function spawnPlusOne(x, y) {
      const el = document.createElement('div');
      el.className = 'plus-one';
      el.textContent = '+1';
      el.style.left = `${x}px`;
      el.style.top = `${y + 16}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 750);
    }

    function onGoalScored() {
      playGoalChime();
      goalPosts.netBounce = 1.0;
      spawnPlusOne(puck.x, goalPosts.y);

      if (!sprintActive) {
        sprintActive = true;
        goals = 1;
        timeLeft = 15.0;
        topHud.classList.add('visible');
      } else {
        goals += 1;
      }

      scoreText.textContent = `${goals} ${goals === 1 ? 'goal' : 'goals'}`;

      // Serve puck back toward center
      puck.x = W * 0.5;
      puck.y = H * 0.35;
      puck.vx = (Math.random() - 0.5) * 6;
      puck.vy = 5;
    }

    function renderLeaderboard(highlightName = null) {
      scores.sort((a, b) => b.goals - a.goals);
      scores = scores.slice(0, 10);
      localStorage.setItem('vm_silber_lb', JSON.stringify(scores));

      lbRows.innerHTML = scores.map((s) => `
        <li class="lb-row ${s.name === highlightName ? 'me' : ''}">
          <span>${s.name}</span>
          <span>${s.goals}</span>
        </li>
      `).join('');
    }

    function finishSprint() {
      sprintActive = false;
      finalGoalsText.textContent = `${goals} ${goals === 1 ? 'goal' : 'goals'}`;
      signForm.style.display = 'flex';
      renderLeaderboard();
      lbModal.classList.add('open');
    }

    signForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = (initialsInput.value || 'VM').toUpperCase();
      scores.push({ name, goals });
      signForm.style.display = 'none';
      initialsInput.value = '';
      renderLeaderboard(name);
    });

    playAgainBtn.addEventListener('click', () => {
      lbModal.classList.remove('open');
      goals = 0;
      timeLeft = 15.0;
      scoreText.textContent = '0 goals';
      timerText.textContent = ':15';
      topHud.classList.remove('visible');
      resetPuck();
    });

    doneBtn.addEventListener('click', () => {
      lbModal.classList.remove('open');
      topHud.classList.remove('visible');
    });

    openLbPill.addEventListener('click', () => {
      finalGoalsText.textContent = `${goals} ${goals === 1 ? 'goal' : 'goals'}`;
      signForm.style.display = 'none';
      renderLeaderboard();
      lbModal.classList.add('open');
    });

    // Bounce off the centered "Vincent Meert" name pill
    function collideWithNameBox() {
      const rect = nameBox.getBoundingClientRect();
      const closestX = Math.max(rect.left, Math.min(puck.x, rect.right));
      const closestY = Math.max(rect.top, Math.min(puck.y, rect.bottom));
      const dx = puck.x - closestX;
      const dy = puck.y - closestY;
      const distSq = dx * dx + dy * dy;

      if (distSq < puck.r * puck.r) {
        const dist = Math.sqrt(distSq) || 0.001;
        const nx = dx / dist;
        const ny = dy / dist;
        const overlap = puck.r - dist;

        puck.x += nx * overlap;
        puck.y += ny * overlap;

        const vn = puck.vx * nx + puck.vy * ny;
        if (vn < 0) {
          puck.vx -= 2.1 * vn * nx;
          puck.vy -= 2.1 * vn * ny;

          const spd = Math.hypot(puck.vx, puck.vy);
          playTone(260 + spd * 8, 0.07, 'sine', Math.min(0.25, spd / 40));

          // Subtle spring jolt on the name text
          nameBox.style.transform = `translate(${-nx * 6}px, ${-ny * 6}px) scale(0.96)`;
          setTimeout(() => {
            nameBox.style.transform = 'translate(0, 0) scale(1)';
          }, 140);
        }
      }
    }

    // Collide with Goal Posts
    function collideWithPost(px, py) {
      const dx = puck.x - px;
      const dy = puck.y - py;
      const dist = Math.hypot(dx, dy);
      const minDist = puck.r + goalPosts.postRadius;

      if (dist < minDist) {
        const nx = dx / (dist || 1);
        const ny = dy / (dist || 1);
        puck.x += nx * (minDist - dist);
        puck.y += ny * (minDist - dist);

        const vn = puck.vx * nx + puck.vy * ny;
        if (vn < 0) {
          puck.vx -= 1.9 * vn * nx;
          puck.vy -= 1.9 * vn * ny;
          playTone(420, 0.09, 'triangle', 0.25);
        }
      }
    }

    function tick(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      // Update 15-second sprint clock
      if (sprintActive) {
        timeLeft -= dt;
        if (timeLeft <= 0) {
          timeLeft = 0;
          timerText.textContent = ':00';
          finishSprint();
        } else {
          const secs = Math.ceil(timeLeft);
          timerText.textContent = `:${secs < 10 ? '0' + secs : secs}`;
        }
      }

      // Compute cursor velocity
      cursor.vx = cursor.x - cursor.px;
      cursor.vy = cursor.y - cursor.py;
      cursor.px = cursor.x;
      cursor.py = cursor.y;

      // Apply puck velocity & friction (scaled by user slider)
      const damping = Math.pow(1 - puckFriction * 0.45, dt * 60);
      puck.x += puck.vx;
      puck.y += puck.vy;
      puck.vx *= damping;
      puck.vy *= damping;

      // Cursor Mallet vs Puck Collision
      const dx = puck.x - cursor.x;
      const dy = puck.y - cursor.y;
      const dist = Math.hypot(dx, dy);
      const minDist = puck.r + cursor.r;

      if (dist < minDist) {
        const nx = dx / (dist || 1);
        const ny = dy / (dist || 1);
        const overlap = minDist - dist;

        puck.x += nx * overlap;
        puck.y += ny * overlap;

        const relVx = puck.vx - cursor.vx;
        const relVy = puck.vy - cursor.vy;
        const vn = relVx * nx + relVy * ny;

        if (vn < 0) {
          puck.vx -= 1.85 * vn * nx;
          puck.vy -= 1.85 * vn * ny;
          puck.vx += cursor.vx * 0.42;
          puck.vy += cursor.vy * 0.42;
        }

        const hitSpd = Math.hypot(puck.vx, puck.vy);
        playTone(190 + hitSpd * 7, 0.07, 'sine', Math.min(0.3, hitSpd / 35));

        // Squash & stretch bounce FX
        puck.scaleX = 1.28;
        puck.scaleY = 0.76;
      }

      // Cap max speed
      const spd = Math.hypot(puck.vx, puck.vy);
      if (spd > 36) {
        puck.vx = (puck.vx / spd) * 36;
        puck.vy = (puck.vy / spd) * 36;
      }

      // Goal Detection & Post Collisions
      const halfGoal = (baseGoalWidth * goalMultiplier) / 2;
      const leftPostX = W * 0.5 - halfGoal;
      const rightPostX = W * 0.5 + halfGoal;

      collideWithPost(leftPostX, goalPosts.y);
      collideWithPost(rightPostX, goalPosts.y);

      // Check if puck crosses the goal line between posts
      if (
        puck.y - puck.r <= goalPosts.y &&
        puck.y + puck.r >= goalPosts.y - goalPosts.netDepth &&
        puck.x > leftPostX + goalPosts.postRadius &&
        puck.x < rightPostX - goalPosts.postRadius &&
        puck.vy < 0
      ) {
        onGoalScored();
      }

      // Viewport Wall Bounces with Squash FX
      if (puck.x - puck.r <= 0) {
        puck.x = puck.r;
        puck.vx = Math.abs(puck.vx) * 0.9;
        puck.scaleX = 0.78;
        puck.scaleY = 1.22;
        playTone(150 + Math.abs(puck.vx) * 6, 0.06, 'sine', Math.min(0.22, Math.abs(puck.vx) / 35));
      } else if (puck.x + puck.r >= W) {
        puck.x = W - puck.r;
        puck.vx = -Math.abs(puck.vx) * 0.9;
        puck.scaleX = 0.78;
        puck.scaleY = 1.22;
        playTone(150 + Math.abs(puck.vx) * 6, 0.06, 'sine', Math.min(0.22, Math.abs(puck.vx) / 35));
      }

      if (puck.y - puck.r <= 0) {
        puck.y = puck.r;
        puck.vy = Math.abs(puck.vy) * 0.9;
        puck.scaleX = 1.22;
        puck.scaleY = 0.78;
        playTone(150 + Math.abs(puck.vy) * 6, 0.06, 'sine', Math.min(0.22, Math.abs(puck.vy) / 35));
      } else if (puck.y + puck.r >= H) {
        puck.y = H - puck.r;
        puck.vy = -Math.abs(puck.vy) * 0.9;
        puck.scaleX = 1.22;
        puck.scaleY = 0.78;
        playTone(150 + Math.abs(puck.vy) * 6, 0.06, 'sine', Math.min(0.22, Math.abs(puck.vy) / 35));
      }

      // Collide with centered name
      collideWithNameBox();

      // Relax squash & stretch back to 1.0
      puck.scaleX += (1 - puck.scaleX) * 0.22;
      puck.scaleY += (1 - puck.scaleY) * 0.22;
      goalPosts.netBounce *= 0.88;

      // Render Canvas
      ctx.clearRect(0, 0, W, H);

      const fgColor = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
      const mutedColor = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();

      // Draw Goal Net & Posts
      ctx.save();
      ctx.strokeStyle = mutedColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      const netStretch = goalPosts.netBounce * 10;
      ctx.moveTo(leftPostX, goalPosts.y);
      ctx.lineTo(leftPostX + 6, goalPosts.y - goalPosts.netDepth - netStretch);
      ctx.lineTo(rightPostX - 6, goalPosts.y - goalPosts.netDepth - netStretch);
      ctx.lineTo(rightPostX, goalPosts.y);
      ctx.stroke();

      // Goal Posts
      ctx.fillStyle = fgColor;
      ctx.beginPath();
      ctx.arc(leftPostX, goalPosts.y, goalPosts.postRadius, 0, Math.PI * 2);
      ctx.arc(rightPostX, goalPosts.y, goalPosts.postRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Draw Puck with Squash & Stretch
      ctx.save();
      ctx.translate(puck.x, puck.y);
      const angle = Math.atan2(puck.vy, puck.vx);
      ctx.rotate(angle);
      ctx.scale(puck.scaleX, puck.scaleY);
      ctx.beginPath();
      ctx.arc(0, 0, puck.r, 0, Math.PI * 2);
      ctx.fillStyle = fgColor;
      ctx.fill();
      ctx.restore();

      // Draw Mallet Cursor
      ctx.save();
      ctx.beginPath();
      ctx.arc(cursor.x, cursor.y, cursor.r, 0, Math.PI * 2);
      ctx.strokeStyle = fgColor;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cursor.x, cursor.y, 3, 0, Math.PI * 2);
      ctx.fillStyle = fgColor;
      ctx.fill();
      ctx.restore();

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
