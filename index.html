<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vincent Meert</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #7b3fe4;
      transition: background-color 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: "Helvetica Neue", Helvetica, "Inter", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      cursor: grab;
    }

    body.dragging {
      cursor: grabbing;
    }

    body.shattered {
      cursor: pointer;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    let W = window.innerWidth;
    let H = window.innerHeight;
    let FONT_SIZE = Math.min(W, H) < 600 ? 18 : 25;
    let OUTER_PAD = Math.round(FONT_SIZE * 0.38);

    // ---------------------------------------------------------
    // 1. PALETTE, TEXT COLOR TOGGLE & PROPORTIONAL METRICS
    // ---------------------------------------------------------
    const BG_PALETTE = [
      '#7b3fe4', // Electric Violet
      '#00d2ff', // Bright Cyan
      '#3b82f6', // Vibrant Cobalt
      '#ff4d2d', // International Orange
      '#10b981', // Bright Emerald
      '#ec4899', // Hot Magenta
      '#6366f1', // Indigo
      '#f59e0b', // Warm Amber
      '#14b8a6', // Teal
      '#f43f5e'  // Coral Rose
    ];
    let currentColorIdx = 0;
    let isTextWhite = true;

    function triggerEdgeColorShift() {
      let nextIdx = currentColorIdx;
      while (nextIdx === currentColorIdx) {
        nextIdx = Math.floor(Math.random() * BG_PALETTE.length);
      }
      currentColorIdx = nextIdx;
      document.body.style.backgroundColor = BG_PALETTE[currentColorIdx];
      isTextWhite = !isTextWhite;
    }

    const RING_TEXT = "vincent meert: 360° sales cycle, strong background in tech & ai, finance and leading creative agencies.";
    const NUM_NODES = RING_TEXT.length;

    const GRAVITY = 0.14;
    const MAX_OMEGA = 0.045;

    const ball = {
      x: W * 0.5,
      y: H * 0.42,
      vx: 0.45,
      vy: 0,
      radius: 178,
      angle: -0.5,
      omega: 0.006,
      isDragging: false,
      dragOffsetX: 0,
      dragOffsetY: 0,
      lastWallHit: 0,
      wasTouchingEdge: false,
      strain: 0,
      lastCrackCrush: 0,
      lastCrackTime: 0,
      state: 'intact', // 'intact' | 'shattered' | 'reforming'
      reformStart: 0,
      nodes: []
    };

    for (let i = 0; i < NUM_NODES; i++) {
      ball.nodes.push({
        char: RING_TEXT[i],
        thetaOffset: 0,
        rOffset: 0,
        rVel: 0,
        wx: W * 0.5,
        wy: H * 0.42,
        wAngle: 0,
        vx: 0,
        vy: 0,
        vRot: 0
      });
    }

    function computeTypographyMetrics() {
      FONT_SIZE = Math.min(W, H) < 600 ? 18 : 25;
      OUTER_PAD = Math.round(FONT_SIZE * 0.38);
      ctx.font = `400 ${FONT_SIZE}px "Helvetica Neue", Helvetica, "Inter", -apple-system, Arial, sans-serif`;

      const tracking = FONT_SIZE * 0.012;
      const charCenters = [];
      let cursor = 0;

      for (let i = 0; i < NUM_NODES; i++) {
        const w = ctx.measureText(RING_TEXT[i]).width + tracking;
        charCenters.push(cursor + w * 0.5);
        cursor += w;
      }

      const totalCircumference = cursor;
      ball.radius = totalCircumference / (Math.PI * 2);

      for (let i = 0; i < NUM_NODES; i++) {
        ball.nodes[i].thetaOffset = (charCenters[i] / totalCircumference) * Math.PI * 2;
      }
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      computeTypographyMetrics();
    }
    resize();
    window.addEventListener('resize', resize);

    for (let i = 0; i < NUM_NODES; i++) {
      const theta = ball.angle + ball.nodes[i].thetaOffset;
      ball.nodes[i].wx = ball.x + Math.cos(theta) * ball.radius;
      ball.nodes[i].wy = ball.y + Math.sin(theta) * ball.radius;
      ball.nodes[i].wAngle = theta + Math.PI * 0.5;
    }

    // ---------------------------------------------------------
    // 2. WEB AUDIO SYNTH (BOUNCE, COMPRESSION CRACKING & SHATTER)
    // ---------------------------------------------------------
    let audioCtx = null;
    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBounceSound(intensity) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const vol = Math.min(0.35, Math.max(0.03, intensity / 20));

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(100 + intensity * 4, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.14);

      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.15);
    }

    // Synthesizes crisp structural micro-fractures as the ring is compressed
    function playCrackSound(stressLevel) {
      if (!audioCtx) return;
      const clampedStress = Math.min(1, Math.max(0.05, stressLevel));
      // Under heavier compression, fire a double micro-snap for a realistic splintering feel
      const snapCount = clampedStress > 0.55 && Math.random() > 0.35 ? 2 : 1;

      for (let s = 0; s < snapCount; s++) {
        const delay = s * (0.014 + Math.random() * 0.018);
        const start = audioCtx.currentTime + delay;

        // 1. High-voltage brittle fracture noise burst
        const dur = 0.024 + clampedStress * 0.016;
        const bufferSize = Math.floor(audioCtx.sampleRate * dur);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.18));
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1350 + clampedStress * 1750 + (Math.random() - 0.5) * 450, start);
        filter.Q.setValueAtTime(3.2 + clampedStress * 2.0, start);

        const noiseGain = audioCtx.createGain();
        const peakVol = Math.min(0.45, 0.09 + clampedStress * 0.32) * (s === 1 ? 0.72 : 1);
        noiseGain.gain.setValueAtTime(peakVol, start);
        noiseGain.gain.exponentialRampToValueAtTime(0.002, start + dur);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noise.start(start);

        // 2. Taut shell tension impulse
        const snapOsc = audioCtx.createOscillator();
        const snapGain = audioCtx.createGain();
        snapOsc.type = 'triangle';
        snapOsc.frequency.setValueAtTime(420 + clampedStress * 680 + Math.random() * 180, start);
        snapOsc.frequency.exponentialRampToValueAtTime(95, start + 0.022);

        snapGain.gain.setValueAtTime(peakVol * 0.55, start);
        snapGain.gain.exponentialRampToValueAtTime(0.001, start + 0.024);

        snapOsc.connect(snapGain);
        snapGain.connect(audioCtx.destination);
        snapOsc.start(start);
        snapOsc.stop(start + 0.025);
      }
    }

    function playShatterSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const bufferSize = audioCtx.sampleRate * 0.18;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.28));
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1950, now);
      filter.Q.setValueAtTime(1.6, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.005, now + 0.18);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);

      playCrackSound(1.0);
      playBounceSound(15);
    }

    // ---------------------------------------------------------
    // 3. POINTER INTERACTION, GENTLE SPIN & CLICK-TO-RESPAWN
    // ---------------------------------------------------------
    const pointer = {
      x: W * 0.5,
      y: H * 0.5,
      px: W * 0.5,
      py: H * 0.5,
      vx: 0,
      vy: 0,
      down: false
    };

    window.addEventListener('wheel', (e) => {
      if (ball.state === 'intact') {
        ball.omega += (e.deltaY + e.deltaX) * 0.00006;
        ball.omega = Math.max(-MAX_OMEGA, Math.min(MAX_OMEGA, ball.omega));
      }
    }, { passive: true });

    window.addEventListener('pointerdown', (e) => {
      unlockAudio();
      pointer.down = true;
      pointer.x = pointer.px = e.clientX;
      pointer.y = pointer.py = e.clientY;

      if (ball.state === 'shattered') {
        const margin = ball.radius + OUTER_PAD;
        ball.x = Math.max(margin, Math.min(W - margin, e.clientX));
        ball.y = Math.max(margin, Math.min(H - margin, e.clientY));
        ball.vx = (Math.random() - 0.5) * 1.5;
        ball.vy = 0;
        ball.omega = 0.008;
        ball.state = 'reforming';
        ball.reformStart = performance.now();
        document.body.classList.remove('shattered');
        playBounceSound(8);
        return;
      }

      if (ball.state !== 'intact') return;

      const dist = Math.hypot(pointer.x - ball.x, pointer.y - ball.y);
      if (dist <= ball.radius + OUTER_PAD * 2) {
        ball.isDragging = true;
        ball.dragOffsetX = ball.x - pointer.x;
        ball.dragOffsetY = ball.y - pointer.y;
        ball.vx = 0;
        ball.vy = 0;
        ball.lastCrackCrush = 0;
        document.body.classList.add('dragging');
      }
    });

    window.addEventListener('pointermove', (e) => {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
    });

    window.addEventListener('pointerup', () => {
      pointer.down = false;
      if (ball.isDragging) {
        ball.isDragging = false;
        ball.lastCrackCrush = 0;
        document.body.classList.remove('dragging');

        ball.vx = Math.max(-22, Math.min(22, pointer.vx * 0.65));
        ball.vy = Math.max(-22, Math.min(22, pointer.vy * 0.65));

        const rx = pointer.x - ball.x;
        const ry = pointer.y - ball.y;
        const crossTorque = (rx * pointer.vy - ry * pointer.vx) / (ball.radius * ball.radius);
        const horizontalSpin = pointer.vx / (ball.radius * 1.8);
        ball.omega += crossTorque * 0.16 + horizontalSpin * 0.12;
        ball.omega = Math.max(-MAX_OMEGA, Math.min(MAX_OMEGA, ball.omega));
      }
    });

    // ---------------------------------------------------------
    // 4. POP / SHATTER THE BALL OF TEXT
    // ---------------------------------------------------------
    function triggerBallCrackOpen() {
      ball.state = 'shattered';
      ball.isDragging = false;
      ball.strain = 0;
      ball.lastCrackCrush = 0;
      ball.vx = 0;
      ball.vy = 0;
      ball.omega = 0;
      document.body.classList.remove('dragging');
      document.body.classList.add('shattered');

      playShatterSound();
      triggerEdgeColorShift();

      const burstX = ball.x;
      const burstY = ball.y;

      for (let i = 0; i < NUM_NODES; i++) {
        const n = ball.nodes[i];
        const dx = n.wx - burstX;
        const dy = n.wy - burstY;
        const dist = Math.hypot(dx, dy) || 1;
        const nx = dx / dist;
        const ny = dy / dist;

        const popSpeed = 4 + Math.random() * 9;
        n.vx = nx * popSpeed + (Math.random() - 0.5) * 5;
        n.vy = ny * popSpeed + (Math.random() - 0.5) * 5 - 2.5;
        n.vRot = (Math.random() - 0.5) * 0.14;
        n.rOffset = 0;
        n.rVel = 0;
      }
    }

    // ---------------------------------------------------------
    // 5. PHYSICS STEP (FLUSH EDGE CONTACT, CRACKING & INDENT)
    // ---------------------------------------------------------
    function updatePhysics(now) {
      pointer.vx = pointer.x - pointer.px;
      pointer.vy = pointer.y - pointer.py;
      pointer.px = pointer.x;
      pointer.py = pointer.y;

      const outerRadius = ball.radius + OUTER_PAD;

      // STATE 1: SHATTERED (FLOATS DOWN IN LOW GRAVITY, WAITS FOR CLICK)
      if (ball.state === 'shattered') {
        const pad = OUTER_PAD;
        for (let i = 0; i < NUM_NODES; i++) {
          const n = ball.nodes[i];
          n.vy += 0.12;
          n.vx *= 0.99;
          n.vy *= 0.99;
          n.wx += n.vx;
          n.wy += n.vy;
          n.wAngle += n.vRot;

          if (n.wx < pad) { n.wx = pad; n.vx = Math.abs(n.vx) * 0.7; }
          if (n.wx > W - pad) { n.wx = W - pad; n.vx = -Math.abs(n.vx) * 0.7; }
          if (n.wy < pad) { n.wy = pad; n.vy = Math.abs(n.vy) * 0.7; }
          if (n.wy > H - pad) {
            n.wy = H - pad;
            n.vy = -Math.abs(n.vy) * 0.55;
            n.vx *= 0.9;
            n.vRot *= 0.88;
            if (Math.abs(n.vy) < 0.25) n.vy = 0;
          }
        }
        return;
      }

      // STATE 2: REFORMING AFTER USER CLICK
      if (ball.state === 'reforming') {
        const duration = 0.55;
        const elapsed = Math.max(0, (now - ball.reformStart) / 1000);
        const t = Math.min(1, elapsed / duration);
        const ease = 1 - Math.pow(1 - t, 3);

        for (let i = 0; i < NUM_NODES; i++) {
          const n = ball.nodes[i];
          const theta = ball.angle + n.thetaOffset;
          const targetX = ball.x + Math.cos(theta) * ball.radius;
          const targetY = ball.y + Math.sin(theta) * ball.radius;
          const targetAngle = theta + Math.PI * 0.5;

          n.wx += (targetX - n.wx) * (0.14 + ease * 0.34);
          n.wy += (targetY - n.wy) * (0.14 + ease * 0.34);

          let diff = ((targetAngle - n.wAngle) % (Math.PI * 2));
          if (diff > Math.PI) diff -= Math.PI * 2;
          if (diff < -Math.PI) diff += Math.PI * 2;
          n.wAngle += diff * (0.16 + ease * 0.34);

          n.rOffset = 0;
          n.rVel = 0;
        }

        if (t >= 1) {
          ball.state = 'intact';
        }
        return;
      }

      // STATE 3: INTACT BALL WITH FLUSH EDGE STOPPING
      const canTriggerWallColor = (now - ball.lastWallHit) > 130;

      if (ball.isDragging) {
        const targetX = pointer.x + ball.dragOffsetX;
        const targetY = pointer.y + ball.dragOffsetY;
        ball.vx = (targetX - ball.x) * 0.4;
        ball.vy = (targetY - ball.y) * 0.4;
        ball.x += ball.vx;
        ball.y += ball.vy;

        const rx = pointer.x - ball.x;
        const ry = pointer.y - ball.y;
        const dragTorque = (rx * pointer.vy - ry * pointer.vx) / (ball.radius * ball.radius);
        ball.omega = ball.omega * 0.92 + dragTorque * 0.08 + (ball.vx / ball.radius) * 0.04;
        ball.omega = Math.max(-MAX_OMEGA, Math.min(MAX_OMEGA, ball.omega));

        const touchingEdge =
          ball.x - outerRadius <= 0 ||
          ball.x + outerRadius >= W ||
          ball.y - outerRadius <= 0 ||
          ball.y + outerRadius >= H;

        if (touchingEdge && !ball.wasTouchingEdge && canTriggerWallColor) {
          triggerEdgeColorShift();
          playBounceSound(6);
          ball.lastWallHit = now;
        }
        ball.wasTouchingEdge = touchingEdge;
      } else {
        ball.wasTouchingEdge = false;

        ball.vy += GRAVITY;
        ball.x += ball.vx;
        ball.y += ball.vy;

        ball.vx *= 0.996;
        ball.omega *= 0.997;

        // Left Wall Flush Stop & Bounce
        if (ball.x - outerRadius <= 0) {
          ball.x = outerRadius;
          if (ball.vx < 0) {
            const impact = Math.abs(ball.vx);
            ball.vx = Math.abs(ball.vx) * 0.84;
            ball.omega += (ball.vy * 0.0007) + (impact * 0.0008);
            if (canTriggerWallColor && impact > 0.6) {
              triggerEdgeColorShift();
              playBounceSound(impact);
              ball.lastWallHit = now;
            }
          }
        }
        // Right Wall Flush Stop & Bounce
        else if (ball.x + outerRadius >= W) {
          ball.x = W - outerRadius;
          if (ball.vx > 0) {
            const impact = Math.abs(ball.vx);
            ball.vx = -Math.abs(ball.vx) * 0.84;
            ball.omega += (-ball.vy * 0.0007) - (impact * 0.0008);
            if (canTriggerWallColor && impact > 0.6) {
              triggerEdgeColorShift();
              playBounceSound(impact);
              ball.lastWallHit = now;
            }
          }
        }

        // Top Ceiling Flush Stop & Bounce
        if (ball.y - outerRadius <= 0) {
          ball.y = outerRadius;
          if (ball.vy < 0) {
            const impact = Math.abs(ball.vy);
            ball.vy = Math.abs(ball.vy) * 0.8;
            ball.omega += -ball.vx * 0.0008;
            if (canTriggerWallColor && impact > 0.6) {
              triggerEdgeColorShift();
              playBounceSound(impact);
              ball.lastWallHit = now;
            }
          }
        }
        // Bottom Floor Flush Stop, Soft Moon Bounce & Gentle Roll
        else if (ball.y + outerRadius >= H) {
          ball.y = H - outerRadius;

          if (ball.vy > 0) {
            const impact = Math.abs(ball.vy);

            if (impact > 0.75) {
              ball.vy = -impact * 0.74;
              ball.vx += ball.omega * ball.radius * 0.06;
              ball.omega += (ball.vx / ball.radius) * 0.12 + (impact * 0.0008 * (ball.omega >= 0 ? 1 : -1));

              if (canTriggerWallColor && impact > 1.1) {
                triggerEdgeColorShift();
                playBounceSound(impact);
                ball.lastWallHit = now;
              }
            } else {
              ball.vy = 0;
            }
          }

          ball.vx *= 0.988;
          const targetRollOmega = (ball.vx / ball.radius) * 0.85;
          if (Math.abs(ball.vx) > 0.08) {
            ball.omega += (targetRollOmega - ball.omega) * 0.06;
          } else {
            ball.vx = 0;
            ball.omega *= 0.994;
          }
        }

        ball.omega = Math.max(-MAX_OMEGA, Math.min(MAX_OMEGA, ball.omega));

        if (Math.abs(ball.omega) < 0.0001 && Math.abs(ball.vx) < 0.04) {
          ball.omega = 0;
        }
      }

      ball.angle += ball.omega;

      // ---------------------------------------------------------
      // PRECISION INDENTATION SOLVER FLUSH WITH SCREEN BORDER
      // ---------------------------------------------------------
      let totalCrush = 0;
      let maxNodeCrush = 0;
      const wallPad = OUTER_PAD;

      for (let i = 0; i < NUM_NODES; i++) {
        const node = ball.nodes[i];
        const theta = ball.angle + node.thetaOffset;
        const cosT = Math.cos(theta);
        const sinT = Math.sin(theta);

        const idealR = ball.radius;

        if (ball.isDragging) {
          let maxAllowedR = idealR;

          if (cosT < -0.001) {
            maxAllowedR = Math.min(maxAllowedR, (wallPad - ball.x) / cosT);
          } else if (cosT > 0.001) {
            maxAllowedR = Math.min(maxAllowedR, (W - wallPad - ball.x) / cosT);
          }

          if (sinT < -0.001) {
            maxAllowedR = Math.min(maxAllowedR, (wallPad - ball.y) / sinT);
          } else if (sinT > 0.001) {
            maxAllowedR = Math.min(maxAllowedR, (H - wallPad - ball.y) / sinT);
          }

          const rawCrush = Math.max(0, idealR - maxAllowedR);
          if (rawCrush > 0) {
            totalCrush += rawCrush;
            if (rawCrush > maxNodeCrush) maxNodeCrush = rawCrush;

            node.rOffset = Math.max(-idealR * 0.78, maxAllowedR - idealR);
            node.rVel = 0;
          } else {
            node.rVel += -node.rOffset * 0.22;
            node.rVel *= 0.76;
            node.rOffset += node.rVel;
          }
        } else {
          node.rVel += -node.rOffset * 0.24;
          node.rVel *= 0.74;
          node.rOffset += node.rVel;
        }
      }

      if (ball.isDragging && totalCrush > 0) {
        const bulge = Math.min(30, (totalCrush / NUM_NODES) * 0.75);
        for (let i = 0; i < NUM_NODES; i++) {
          const curr = ball.nodes[i];
          if (curr.rOffset >= -0.5) {
            curr.rOffset += bulge * 0.06;
          }
        }
      }

      for (let i = 0; i < NUM_NODES; i++) {
        const theta = ball.angle + ball.nodes[i].thetaOffset;
        const r = ball.radius + (ball.nodes[i].rOffset || 0);
        const rawWx = ball.x + Math.cos(theta) * r;
        const rawWy = ball.y + Math.sin(theta) * r;

        ball.nodes[i].wx = Math.max(wallPad, Math.min(W - wallPad, rawWx));
        ball.nodes[i].wy = Math.max(wallPad, Math.min(H - wallPad, rawWy));
      }

      for (let i = 0; i < NUM_NODES; i++) {
        const prev = ball.nodes[(i - 1 + NUM_NODES) % NUM_NODES];
        const next = ball.nodes[(i + 1) % NUM_NODES];
        ball.nodes[i].wAngle = Math.atan2(next.wy - prev.wy, next.wx - prev.wx);
      }

      // ---------------------------------------------------------
      // PROGRESSIVE CRACKING AUDIO & SHATTER THRESHOLD
      // ---------------------------------------------------------
      const crushRatio = maxNodeCrush / ball.radius;

      if (ball.isDragging && crushRatio > 0.08) {
        // 1. Ratchet cracking as the user pushes deeper into the frame
        const stepSize = Math.max(0.022, 0.055 - crushRatio * 0.05);
        if (crushRatio >= ball.lastCrackCrush + stepSize && (now - ball.lastCrackTime) > 45) {
          const stress = Math.min(1, (crushRatio - 0.08) / 0.55);
          playCrackSound(stress);
          ball.lastCrackCrush = crushRatio;
          ball.lastCrackTime = now;
        } else if (crushRatio < ball.lastCrackCrush - 0.03) {
          // Reset ratchet down when user eases pressure so pushing back in cracks again
          ball.lastCrackCrush = crushRatio;
        }

        // 2. High-compression structural strain & rapid pre-shatter cracking
        if (crushRatio > 0.40) {
          ball.strain += (crushRatio - 0.36) * 0.085;
          const strainInterval = Math.max(48, 190 - ball.strain * 145);
          if ((now - ball.lastCrackTime) > strainInterval) {
            playCrackSound(Math.min(1, 0.55 + ball.strain * 0.45));
            ball.lastCrackTime = now;
          }

          if (crushRatio > 0.68 || ball.strain >= 1.0) {
            triggerBallCrackOpen();
          }
        } else {
          ball.strain = Math.max(0, ball.strain - 0.05);
        }
      } else {
        ball.strain = Math.max(0, ball.strain - 0.05);
        ball.lastCrackCrush = 0;
      }
    }

    // ---------------------------------------------------------
    // 6. RENDER LOOP
    // ---------------------------------------------------------
    function render(now) {
      updatePhysics(now || performance.now());

      ctx.clearRect(0, 0, W, H);

      ctx.font = `400 ${FONT_SIZE}px "Helvetica Neue", Helvetica, "Inter", -apple-system, Arial, sans-serif`;
      ctx.fillStyle = isTextWhite ? '#ffffff' : '#000000';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < NUM_NODES; i++) {
        const n = ball.nodes[i];
        if (!Number.isFinite(n.wx) || !Number.isFinite(n.wy)) continue;

        let jitterX = 0;
        let jitterY = 0;
        let jitterRot = 0;
        if (ball.state === 'intact' && ball.strain > 0.12) {
          const mag = ball.strain * 3.8;
          jitterX = (Math.random() - 0.5) * mag;
          jitterY = (Math.random() - 0.5) * mag;
          jitterRot = (Math.random() - 0.5) * (ball.strain * 0.18);
        }

        ctx.save();
        ctx.translate(n.wx + jitterX, n.wy + jitterY);
        ctx.rotate((n.wAngle || 0) + jitterRot);
        ctx.fillText(n.char, 0, 0);
        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
