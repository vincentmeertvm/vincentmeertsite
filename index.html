<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vincent Meert</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #7b3fe4;
      transition: background-color 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      cursor: grab;
    }

    body.dragging {
      cursor: grabbing;
    }

    body.shattered {
      cursor: pointer;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    let W = window.innerWidth;
    let H = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    // ---------------------------------------------------------
    // 1. CURATED BACKGROUND COLOR PALETTE & RING TEXT
    // ---------------------------------------------------------
    const BG_PALETTE = [
      '#7b3fe4', // Electric Violet
      '#2563eb', // Cobalt Blue
      '#ff4d2d', // International Orange
      '#059669', // Deep Emerald
      '#db2777', // Vibrant Magenta
      '#4f46e5', // Ultramarine Indigo
      '#d97706', // Warm Amber
      '#0d9488', // Deep Teal
      '#e11d48', // Crimson Rose
      '#1e293b'  // Midnight Slate
    ];
    let currentColorIdx = 0;

    function cycleBackgroundColor() {
      let nextIdx = currentColorIdx;
      while (nextIdx === currentColorIdx) {
        nextIdx = Math.floor(Math.random() * BG_PALETTE.length);
      }
      currentColorIdx = nextIdx;
      document.body.style.backgroundColor = BG_PALETTE[currentColorIdx];
    }

    const RING_TEXT = "vincent meert drives growth in tech & ai. previously, he worked across automotive ict & more   ";
    const NUM_NODES = RING_TEXT.length;
    const BASE_RADIUS = Math.min(W, H) < 600 ? 115 : 150;

    // ---------------------------------------------------------
    // 2. WEB AUDIO SYNTH (BOUNCE & SHATTER)
    // ---------------------------------------------------------
    let audioCtx = null;
    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBounceSound(intensity) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const vol = Math.min(0.4, Math.max(0.04, intensity / 24));

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(105 + intensity * 4, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.13);

      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.14);
    }

    function playShatterSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const bufferSize = audioCtx.sampleRate * 0.16;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.28));
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1850, now);
      filter.Q.setValueAtTime(1.8, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.45, now);
      gain.gain.exponentialRampToValueAtTime(0.005, now + 0.16);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);

      playBounceSound(18);
    }

    // ---------------------------------------------------------
    // 3. BALL STATE & PERIMETER NODES
    // ---------------------------------------------------------
    const ball = {
      x: W * 0.5,
      y: H * 0.5,
      vx: 0,           // Stationary until moved by user
      vy: 0,           // Stationary until moved by user
      radius: BASE_RADIUS,
      angle: -0.5,
      omega: 0,        // Stationary rotation until moved
      isDragging: false,
      dragOffsetX: 0,
      dragOffsetY: 0,
      lastWallHit: 0,
      wasTouchingEdge: false,
      strain: 0,
      state: 'intact', // 'intact' | 'shattered' | 'reforming'
      reformStart: 0,
      nodes: []
    };

    for (let i = 0; i < NUM_NODES; i++) {
      ball.nodes.push({
        char: RING_TEXT[i],
        rOffset: 0,
        rVel: 0,
        wx: 0,
        wy: 0,
        wAngle: 0,
        vx: 0,
        vy: 0,
        vRot: 0
      });
    }

    // ---------------------------------------------------------
    // 4. POINTER INTERACTION & CLICK-TO-RESPAWN
    // ---------------------------------------------------------
    const pointer = {
      x: W * 0.5,
      y: H * 0.5,
      px: W * 0.5,
      py: H * 0.5,
      vx: 0,
      vy: 0,
      down: false
    };

    window.addEventListener('pointerdown', (e) => {
      unlockAudio();
      pointer.down = true;
      pointer.x = pointer.px = e.clientX;
      pointer.y = pointer.py = e.clientY;

      // If ball is popped/shattered, clicking anywhere respawns it
      if (ball.state === 'shattered') {
        const margin = ball.radius + 16;
        ball.x = Math.max(margin, Math.min(W - margin, e.clientX));
        ball.y = Math.max(margin, Math.min(H - margin, e.clientY));
        ball.vx = 0;
        ball.vy = 0;
        ball.omega = 0;
        ball.state = 'reforming';
        ball.reformStart = performance.now();
        document.body.classList.remove('shattered');
        playBounceSound(10);
        return;
      }

      if (ball.state !== 'intact') return;

      const dist = Math.hypot(pointer.x - ball.x, pointer.y - ball.y);
      if (dist <= ball.radius * 1.15) {
        ball.isDragging = true;
        ball.dragOffsetX = ball.x - pointer.x;
        ball.dragOffsetY = ball.y - pointer.y;
        ball.vx = 0;
        ball.vy = 0;
        document.body.classList.add('dragging');
      }
    });

    window.addEventListener('pointermove', (e) => {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
    });

    window.addEventListener('pointerup', () => {
      pointer.down = false;
      if (ball.isDragging) {
        ball.isDragging = false;
        document.body.classList.remove('dragging');
        // Transfer flick velocity when released
        ball.vx = Math.max(-34, Math.min(34, pointer.vx * 0.85));
        ball.vy = Math.max(-34, Math.min(34, pointer.vy * 0.85));
      }
    });

    // ---------------------------------------------------------
    // 5. POP / SHATTER THE BALL OF TEXT
    // ---------------------------------------------------------
    function triggerBallCrackOpen() {
      ball.state = 'shattered';
      ball.isDragging = false;
      ball.strain = 0;
      ball.vx = 0;
      ball.vy = 0;
      ball.omega = 0;
      document.body.classList.remove('dragging');
      document.body.classList.add('shattered');

      playShatterSound();
      cycleBackgroundColor();

      const burstX = ball.x;
      const burstY = ball.y;

      for (let i = 0; i < NUM_NODES; i++) {
        const n = ball.nodes[i];
        const dx = n.wx - burstX;
        const dy = n.wy - burstY;
        const dist = Math.hypot(dx, dy) || 1;
        const nx = dx / dist;
        const ny = dy / dist;

        const popSpeed = 6 + Math.random() * 14;
        n.vx = nx * popSpeed + (Math.random() - 0.5) * 8;
        n.vy = ny * popSpeed + (Math.random() - 0.5) * 8 - 3;
        n.vRot = (Math.random() - 0.5) * 0.28;
        n.rOffset = 0;
        n.rVel = 0;
      }
    }

    // ---------------------------------------------------------
    // 6. PHYSICS STEP
    // ---------------------------------------------------------
    function updatePhysics(now) {
      pointer.vx = pointer.x - pointer.px;
      pointer.vy = pointer.y - pointer.py;
      pointer.px = pointer.x;
      pointer.py = pointer.y;

      // STATE 1: SHATTERED (WAITS INDEFINITELY UNTIL USER CLICKS)
      if (ball.state === 'shattered') {
        const pad = 12;
        for (let i = 0; i < NUM_NODES; i++) {
          const n = ball.nodes[i];
          n.vy += 0.32; // Gravity
          n.vx *= 0.985;
          n.vy *= 0.985;
          n.wx += n.vx;
          n.wy += n.vy;
          n.wAngle += n.vRot;

          if (n.wx < pad) { n.wx = pad; n.vx = Math.abs(n.vx) * 0.7; }
          if (n.wx > W - pad) { n.wx = W - pad; n.vx = -Math.abs(n.vx) * 0.7; }
          if (n.wy < pad) { n.wy = pad; n.vy = Math.abs(n.vy) * 0.7; }
          if (n.wy > H - pad) {
            n.wy = H - pad;
            n.vy = -Math.abs(n.vy) * 0.55;
            n.vx *= 0.88;
            n.vRot *= 0.85;
            if (Math.abs(n.vy) < 0.4) n.vy = 0;
          }
        }
        return;
      }

      // STATE 2: REFORMING AFTER USER CLICK
      if (ball.state === 'reforming') {
        const duration = 0.55;
        const t = Math.min(1, (now - ball.reformStart) / 1000 / duration);
        const ease = 1 - Math.pow(1 - t, 3);

        for (let i = 0; i < NUM_NODES; i++) {
          const n = ball.nodes[i];
          const theta = ball.angle + (i / NUM_NODES) * Math.PI * 2;
          const targetX = ball.x + Math.cos(theta) * ball.radius;
          const targetY = ball.y + Math.sin(theta) * ball.radius;
          const targetAngle = theta + Math.PI * 0.5;

          n.wx += (targetX - n.wx) * (0.15 + ease * 0.35);
          n.wy += (targetY - n.wy) * (0.15 + ease * 0.35);

          let diff = ((targetAngle - n.wAngle + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
          n.wAngle += diff * (0.18 + ease * 0.35);
          n.rOffset = 0;
          n.rVel = 0;
        }

        if (t >= 1) {
          ball.state = 'intact';
        }
        return;
      }

      // STATE 3: INTACT BALL
      const canTriggerWallColor = (now - ball.lastWallHit) > 110;

      if (ball.isDragging) {
        // Follow user drag (can be pushed into/over the screen edge to indent)
        const targetX = pointer.x + ball.dragOffsetX;
        const targetY = pointer.y + ball.dragOffsetY;
        ball.vx = (targetX - ball.x) * 0.42;
        ball.vy = (targetY - ball.y) * 0.42;
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.omega *= 0.9;

        const touchingEdge =
          ball.x - ball.radius <= 0 ||
          ball.x + ball.radius >= W ||
          ball.y - ball.radius <= 0 ||
          ball.y + ball.radius >= H;

        if (touchingEdge && !ball.wasTouchingEdge && canTriggerWallColor) {
          cycleBackgroundColor();
          playBounceSound(8);
          ball.lastWallHit = now;
        }
        ball.wasTouchingEdge = touchingEdge;
      } else {
        ball.wasTouchingEdge = false;

        // Move & naturally decelerate to a stop unless moved again
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vx *= 0.992;
        ball.vy *= 0.992;
        ball.omega *= 0.992;

        if (Math.hypot(ball.vx, ball.vy) < 0.05) {
          ball.vx = 0;
          ball.vy = 0;
        }
        if (Math.abs(ball.omega) < 0.0002) {
          ball.omega = 0;
        }

        // RIGID BOUNCE OFF WALLS (Does NOT indent when bouncing off sides in free flight)
        if (ball.x - ball.radius <= 0) {
          ball.x = ball.radius;
          if (ball.vx < 0) {
            const impact = Math.abs(ball.vx);
            ball.vx = Math.abs(ball.vx) * 0.88;
            ball.omega = ball.vy * 0.0016;
            if (canTriggerWallColor && impact > 0.4) {
              cycleBackgroundColor();
              playBounceSound(impact);
              ball.lastWallHit = now;
            }
          }
        } else if (ball.x + ball.radius >= W) {
          ball.x = W - ball.radius;
          if (ball.vx > 0) {
            const impact = Math.abs(ball.vx);
            ball.vx = -Math.abs(ball.vx) * 0.88;
            ball.omega = -ball.vy * 0.0016;
            if (canTriggerWallColor && impact > 0.4) {
              cycleBackgroundColor();
              playBounceSound(impact);
              ball.lastWallHit = now;
            }
          }
        }

        if (ball.y - ball.radius <= 0) {
          ball.y = ball.radius;
          if (ball.vy < 0) {
            const impact = Math.abs(ball.vy);
            ball.vy = Math.abs(ball.vy) * 0.88;
            ball.omega = -ball.vx * 0.0016;
            if (canTriggerWallColor && impact > 0.4) {
              cycleBackgroundColor();
              playBounceSound(impact);
              ball.lastWallHit = now;
            }
          }
        } else if (ball.y + ball.radius >= H) {
          ball.y = H - ball.radius;
          if (ball.vy > 0) {
            const impact = Math.abs(ball.vy);
            ball.vy = -Math.abs(ball.vy) * 0.88;
            ball.omega = ball.vx * 0.0016;
            if (canTriggerWall
