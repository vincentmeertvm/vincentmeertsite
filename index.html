<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vincent Meert</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #7b3fe4;
      transition: background-color 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      cursor: grab;
    }

    body.dragging {
      cursor: grabbing;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    let W = window.innerWidth;
    let H = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    // ---------------------------------------------------------
    // 1. CURATED BACKGROUND COLOR PALETTE & RING TEXT
    // ---------------------------------------------------------
    const BG_PALETTE = [
      '#7b3fe4', // Electric Violet
      '#2563eb', // Cobalt Blue
      '#ff4d2d', // International Orange
      '#059669', // Deep Emerald
      '#db2777', // Vibrant Magenta
      '#4f46e5', // Ultramarine Indigo
      '#d97706', // Warm Amber
      '#0d9488', // Deep Teal
      '#e11d48', // Crimson Rose
      '#1e293b'  // Midnight Slate
    ];
    let currentColorIdx = 0;

    function cycleBackgroundColor() {
      let nextIdx = currentColorIdx;
      while (nextIdx === currentColorIdx) {
        nextIdx = Math.floor(Math.random() * BG_PALETTE.length);
      }
      currentColorIdx = nextIdx;
      document.body.style.backgroundColor = BG_PALETTE[currentColorIdx];
    }

    const RING_TEXT = "vincent meert drives growth in tech & ai. previously, he worked across automotive ict & more   ";
    const NUM_NODES = RING_TEXT.length;
    const BASE_RADIUS = Math.min(W, H) < 600 ? 115 : 150;

    // ---------------------------------------------------------
    // 2. WEB AUDIO SYNTH (BOUNCE, STRAIN CRACKLE, SHATTER)
    // ---------------------------------------------------------
    let audioCtx = null;
    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    window.addEventListener('pointerdown', unlockAudio);

    function playBounceSound(intensity) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const vol = Math.min(0.4, Math.max(0.04, intensity / 24));

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(105 + intensity * 4, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.13);

      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.14);
    }

    function playShatterSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      // Crisp snap + low burst
      const bufferSize = audioCtx.sampleRate * 0.16;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.28));
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1850, now);
      filter.Q.setValueAtTime(1.8, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.45, now);
      gain.gain.exponentialRampToValueAtTime(0.005, now + 0.16);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);

      playBounceSound(18);
    }

    // ---------------------------------------------------------
    // 3. BALL STATE & SOFT-BODY PERIMETER NODES
    // ---------------------------------------------------------
    const ball = {
      x: W * 0.35,
      y: H * 0.65,
      vx: 6.2,
      vy: -5.4,
      radius: BASE_RADIUS,
      angle: -0.5,
      omega: 0.012,
      isDragging: false,
      dragOffsetX: 0,
      dragOffsetY: 0,
      lastWallHit: 0,
      strain: 0,         // Builds up when user crushes ball hard against frame
      crackedOpen: false, // True when ball shatters into loose letters
      crackTimer: 0,
      nodes: []
    };

    for (let i = 0; i < NUM_NODES; i++) {
      ball.nodes.push({
        char: RING_TEXT[i],
        rOffset: 0,
        rVel: 0,
        // World coordinates & free-body state when ball cracks open
        wx: 0,
        wy: 0,
        wAngle: 0,
        vx: 0,
        vy: 0,
        vRot: 0
      });
    }

    // ---------------------------------------------------------
    // 4. POINTER & DRAG INTERACTION (NO HOVER BLOBBING)
    // ---------------------------------------------------------
    const pointer = {
      x: W * 0.5,
      y: H * 0.5,
      px: W * 0.5,
      py: H * 0.5,
      vx: 0,
      vy: 0,
      down: false
    };

    window.addEventListener('pointerdown', (e) => {
      pointer.down = true;
      pointer.x = pointer.px = e.clientX;
      pointer.y = pointer.py = e.clientY;

      if (ball.crackedOpen) return;

      const dist = Math.hypot(pointer.x - ball.x, pointer.y - ball.y);
      if (dist <= ball.radius * 1.15) {
        ball.isDragging = true;
        ball.dragOffsetX = ball.x - pointer.x;
        ball.dragOffsetY = ball.y - pointer.y;
        document.body.classList.add('dragging');
      }
    });

    window.addEventListener('pointermove', (e) => {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
    });

    window.addEventListener('pointerup', () => {
      pointer.down = false;
      if (ball.isDragging) {
        ball.isDragging = false;
        document.body.classList.remove('dragging');
        ball.vx = Math.max(-32, Math.min(32, pointer.vx * 0.85));
        ball.vy = Math.max(-32, Math.min(32, pointer.vy * 0.85));
      }
    });

    // ---------------------------------------------------------
    // 5. CRACK OPEN THE BALL OF TEXT
    // ---------------------------------------------------------
    function triggerBallCrackOpen(now) {
      ball.crackedOpen = true;
      ball.crackTimer = now;
      ball.isDragging = false;
      ball.strain = 0;
      document.body.classList.remove('dragging');

      playShatterSound();
      cycleBackgroundColor();

      // Keep center inside safe bounds for eventual reassembly
      const safeMargin = ball.radius + 20;
      const burstX = ball.x;
      const burstY = ball.y;
      ball.x = Math.max(safeMargin, Math.min(W - safeMargin, ball.x));
      ball.y = Math.max(safeMargin, Math.min(H - safeMargin, ball.y));

      // Pop every letter outward from the fractured ring
      for (let i = 0; i < NUM_NODES; i++) {
        const n = ball.nodes[i];
        const dx = n.wx - burstX;
        const dy = n.wy - burstY;
        const dist = Math.hypot(dx, dy) || 1;
        const nx = dx / dist;
        const ny = dy / dist;

        const popSpeed = 6 + Math.random() * 14;
        n.vx = nx * popSpeed + (Math.random() - 0.5) * 8;
        n.vy = ny * popSpeed + (Math.random() - 0.5) * 8 - 3;
        n.vRot = (Math.random() - 0.5) * 0.28;
        n.rOffset = 0;
        n.rVel = 0;
      }

      // Give the core ball a gentle drift velocity for when it reforms
      ball.vx = (W * 0.5 - burstX) * 0.025;
      ball.vy = (H * 0.5 - burstY) * 0.025;
    }

    // ---------------------------------------------------------
    // 6. PHYSICS STEP (EDGE INDENTATION, WALL COLOR, SHATTER)
    // ---------------------------------------------------------
    function updatePhysics(now) {
      pointer.vx = pointer.x - pointer.px;
      pointer.vy = pointer.y - pointer.py;
      pointer.px = pointer.x;
      pointer.py = pointer.y;

      // STATE A: BALL IS CRACKED OPEN INTO LOOSE TUMBLING LETTERS
      if (ball.crackedOpen) {
        const elapsed = (now - ball.crackTimer) / 1000;
        ball.angle += ball.omega;

        // First 1.4s: letters fly, tumble, and bounce off the screen edges
        // Next 0.8s: letters smoothly magnetize back into the rotating circle
        const reformDuration = 0.85;
        const freeDuration = 1.35;

        for (let i = 0; i < NUM_NODES; i++) {
          const n = ball.nodes[i];

          if (elapsed < freeDuration) {
            n.vy += 0.28; // Gravity on shattered letters
            n.vx *= 0.985;
            n.vy *= 0.985;
            n.wx += n.vx;
            n.wy += n.vy;
            n.wAngle += n.vRot;

            // Letters bounce off viewport limits
            const pad = 10;
            if (n.wx < pad) { n.wx = pad; n.vx = Math.abs(n.vx) * 0.75; }
            if (n.wx > W - pad) { n.wx = W - pad; n.vx = -Math.abs(n.vx) * 0.75; }
            if (n.wy < pad) { n.wy = pad; n.vy = Math.abs(n.vy) * 0.75; }
            if (n.wy > H - pad) { n.wy = H - pad; n.vy = -Math.abs(n.vy) * 0.75; }
          } else {
            // Reassemble smoothly back into the text ring
            const t = Math.min(1, (elapsed - freeDuration) / reformDuration);
            const ease = 1 - Math.pow(1 - t, 3);

            const theta = ball.angle + (i / NUM_NODES) * Math.PI * 2;
            const targetX = ball.x + Math.cos(theta) * ball.radius;
            const targetY = ball.y + Math.sin(theta) * ball.radius;
            const targetAngle = theta + Math.PI * 0.5;

            n.wx += (targetX - n.wx) * (0.12 + ease * 0.25);
            n.wy += (targetY - n.wy) * (0.12 + ease * 0.25);

            // Shortest angular interpolation
            let diff = ((targetAngle - n.wAngle + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
            n.wAngle += diff * (0.15 + ease * 0.25);
          }
        }

        if (elapsed >= freeDuration + reformDuration) {
          ball.crackedOpen = false;
        }
        return;
      }

      // STATE B: INTACT SOFT-BODY RING BOUNCING & INDENTING AT SCREEN LIMITS
      const canTriggerWallColor = (now - ball.lastWallHit) > 110;

      if (ball.isDragging) {
        const targetX = pointer.x + ball.dragOffsetX;
        const targetY = pointer.y + ball.dragOffsetY;
        ball.vx = (targetX - ball.x) * 0.38;
        ball.vy = (targetY - ball.y) * 0.38;
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.omega *= 0.94;

        // Change background color when user first pushes ball into a screen edge
        const touchingEdge =
          ball.x - ball.radius <= 2 ||
          ball.x + ball.radius >= W - 2 ||
          ball.y - ball.radius <= 2 ||
          ball.y + ball.radius >= H - 2;

        if (touchingEdge && !ball.wasTouchingEdge && canTriggerWallColor) {
          cycleBackgroundColor();
          playBounceSound(8);
          ball.lastWallHit = now;
        }
        ball.wasTouchingEdge = touchingEdge;
      } else {
        ball.wasTouchingEdge = false;
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Maintain perpetual edge-to-edge cruise velocity
        const speed = Math.hypot(ball.vx, ball.vy);
        const minCruise = 4.6;
        if (speed > 0.01 && speed < minCruise) {
          ball.vx = (ball.vx / speed) * minCruise;
          ball.vy = (ball.vy / speed) * minCruise;
        } else if (speed > minCruise) {
          ball.vx *= 0.9985;
          ball.vy *= 0.9985;
        }

        // Bounce off Left / Right limits + Change Background Color
        // Allow partial penetration during high-speed impacts so the edge visibly indents the ball
        if (ball.x - ball.radius < 0) {
          const pen = ball.radius - ball.x;
          if (ball.vx < 0 && pen > Math.min(28, Math.abs(ball.vx) * 2.2)) {
            const impact = Math.abs(ball.vx);
            ball.vx = Math.abs(ball.vx) * 0.95;
            ball.omega = ball.vy * 0.0018;
            if (canTriggerWallColor) {
              cycleBackgroundColor();
              playBounceSound(impact);
              ball.lastWallHit = now;
            }
          }
        } else if (ball.x + ball.radius > W) {
          const pen = (ball.x + ball.radius) - W;
          if (ball.vx > 0 && pen > Math.min(28, Math.abs(ball.vx) * 2.2)) {
            const impact = Math.abs(ball.vx);
            ball.vx = -Math.abs(ball.vx) * 0.95;
            ball.omega = -ball.vy * 0.0018;
            if (canTriggerWallColor) {
              cycleBackgroundColor();
              playBounceSound(impact);
              ball.lastWallHit = now;
            }
          }
        }

        // Bounce off Top / Bottom limits + Change Background Color
        if (ball.y - ball.radius < 0) {
          const pen = ball.radius - ball.y;
          if (ball.vy < 0 && pen > Math.min(28, Math.abs(ball.vy) * 2.2)) {
            const impact = Math.abs(ball.vy);
            ball.vy = Math.abs(ball.vy) * 0.95;
            ball.omega = -ball.vx * 0.0018;
            if (canTriggerWallColor) {
              cycleBackgroundColor();
              playBounceSound(impact);
              ball.lastWallHit = now;
            }
          }
        } else if (ball.y + ball.radius > H) {
          const pen = (ball.y + ball.radius) - H;
          if (ball.vy > 0 && pen > Math.min(28, Math.abs(ball.vy) * 2.2)) {
            const impact = Math.abs(ball.vy);
            ball.vy = -Math.abs(ball.vy) * 0.95;
            ball.omega = ball.vx * 0.0018;
            if (canTriggerWallColor) {
              cycleBackgroundColor();
              playBounceSound(impact);
              ball.lastWallHit = now;
            }
          }
        }
      }

      ball.angle += ball.omega;

      // ---------------------------------------------------------
      // SOFT-BODY INDENTATION AGAINST SCREEN LIMITS ONLY
      // ---------------------------------------------------------
      let totalCrush = 0;
      let maxNodeCrush = 0;
      const wallPad = 10;

      for (let i = 0; i < NUM_NODES; i++) {
        const node = ball.nodes[i];
        const theta = ball.angle + (i / NUM_NODES) * Math.PI * 2;
        const cosT = Math.cos(theta);
        const sinT = Math.sin(theta);

        const idealR = ball.radius;
        let currentR = idealR + node.rOffset;
        const wx = ball.x + cosT * currentR;
        const wy = ball.y + sinT * currentR;

        // Constrain every character strictly inside the viewport walls
        let allowedR = currentR;
        if (wx < wallPad && cosT < -0.02) {
          allowedR = Math.min(allowedR, (wallPad - ball.x) / cosT);
        }
        if (wx > W - wallPad && cosT > 0.02) {
          allowedR = Math.min(allowedR, (W - wallPad - ball.x) / cosT);
        }
        if (wy < wallPad && sinT < -0.02) {
          allowedR = Math.min(allowedR, (wallPad - ball.y) / sinT);
        }
        if (wy > H - wallPad && sinT > 0.02) {
          allowedR = Math.min(allowedR, (H - wallPad - ball.y) / sinT);
        }

        // Measure how deeply this side of the ball is indented by the screen limit
        const idealUnclampedX = ball.x + cosT * idealR;
        const idealUnclampedY = ball.y + sinT * idealR;
        const overLeft = Math.max(0, wallPad - idealUnclampedX);
        const overRight = Math.max(0, idealUnclampedX - (W - wallPad));
        const overTop = Math.max(0, wallPad - idealUnclampedY);
        const overBottom = Math.max(0, idealUnclampedY - (H - wallPad));
        const rawCrush = Math.max(overLeft, overRight, overTop, overBottom);

        if (rawCrush > 0) {
          totalCrush += rawCrush;
          if (rawCrush > maxNodeCrush) maxNodeCrush = rawCrush;
        }

        if (allowedR < currentR) {
          node.rOffset = Math.max(-idealR * 0.78, allowedR - idealR);
          node.rVel *= 0.35;
        }

        // Spring restoration back to true circle
        const springK = 0.18;
        const damping = 0.78;
        node.rVel += -node.rOffset * springK;
        node.rVel *= damping;
        node.rOffset += node.rVel;
      }

      // Volume preservation: when pressed against a wall, the adjacent sides bulge out smoothly
      const bulge = Math.min(34, (totalCrush / NUM_NODES) * 0.75);
      for (let i = 0; i < NUM_NODES; i++) {
        const prev = ball.nodes[(i - 1 + NUM_NODES) % NUM_NODES];
        const next = ball.nodes[(i + 1) % NUM_NODES];
        const curr = ball.nodes[i];

        const neighborAvg = (prev.rOffset + next.rOffset) * 0.5;
        curr.rVel += (neighborAvg - curr.rOffset) * 0.3;
        if (curr.rOffset >= -1) {
          curr.rOffset += bulge * 0.075;
        }
      }

      // Update world coordinates & tangent angles for each character
      for (let i = 0; i < NUM_NODES; i++) {
        const theta = ball.angle + (i / NUM_NODES) * Math.PI * 2;
        const r = ball.radius + ball.nodes[i].rOffset;
        ball.nodes[i].wx = ball.x + Math.cos(theta) * r;
        ball.nodes[i].wy = ball.y + Math.sin(theta) * r;
      }

      for (let i = 0; i < NUM_NODES; i++) {
        const prev = ball.nodes[(i - 1 + NUM_NODES) % NUM_NODES];
        const next = ball.nodes[(i + 1) % NUM_NODES];
        ball.nodes[i].wAngle = Math.atan2(next.wy - prev.wy, next.wx - prev.wx);
      }

      // ---------------------------------------------------------
      // CHECK IF USER PUSHED HARD ENOUGH TO CRACK THE BALL OPEN
      // ---------------------------------------------------------
      const crushRatio = maxNodeCrush / ball.radius;
      if (crushRatio > 0.42) {
        // Build strain faster the deeper the user squashes the ball into the wall
        ball.strain += (crushRatio - 0.38) * 0.085;
        if (crushRatio > 0.68 || ball.strain >= 1.0) {
          triggerBallCrackOpen(now);
        }
      } else {
        ball.strain = Math.max(0, ball.strain - 0.04);
      }
    }

    // ---------------------------------------------------------
    // 7. RENDER LOOP
    // ---------------------------------------------------------
    function render(now) {
      updatePhysics(now);

      ctx.clearRect(0, 0, W, H);

      const fontSize = Math.min(W, H) < 600 ? 15 : 19;
      ctx.font = `500 ${fontSize}px -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", sans-serif`;
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < NUM_NODES; i++) {
        const n = ball.nodes[i];

        // Subtle high-pressure jitter on the letters right before the ball cracks open
        let jitterX = 0;
        let jitterY = 0;
        let jitterRot = 0;
        if (!ball.crackedOpen && ball.strain > 0.15) {
          const mag = ball.strain * 3.5;
          jitterX = (Math.random() - 0.5) * mag;
          jitterY = (Math.random() - 0.5) * mag;
          jitterRot = (Math.random() - 0.5) * (ball.strain * 0.18);
        }

        ctx.save();
        ctx.translate(n.wx + jitterX, n.wy + jitterY);
        ctx.rotate(n.wAngle + jitterRot);
        ctx.fillText(n.char, 0, 0);
        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
