<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vincent Meert</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #7b3fe4; /* Exact electric violet from screenshot */
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      cursor: grab;
    }

    body.dragging {
      cursor: grabbing;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    let W = window.innerWidth;
    let H = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    // ---------------------------------------------------------
    // 1. CIRCULAR TEXT & INTERACTIVE LINKS CONFIGURATION
    // ---------------------------------------------------------
    // Exact lowercase cadence and spacing matching your screenshot
    const RING_TEXT = "vincent meert drives growth in tech & ai. previously, he worked across automotive ict & more   ";
    
    // Optional clickable segments along the spinning ring
    const LINKS = [
      { word: "vincent meert", url: "mailto:vincent@meert.cc" },
      { word: "tech & ai", url: "https://linkedin.com" },
      { word: "automotive", url: "https://linkedin.com" }
    ];

    // ---------------------------------------------------------
    // 2. WEB AUDIO SYNTH (RUBBER THUD + GLASS CRACK)
    // ---------------------------------------------------------
    let audioCtx = null;
    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    window.addEventListener('pointerdown', unlockAudio);

    function playBounceSound(intensity) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const vol = Math.min(0.45, Math.max(0.04, intensity / 22));

      // Low rubbery membrane thud
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(95 + intensity * 3.5, now);
      osc.frequency.exponentialRampToValueAtTime(38, now + 0.14);

      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.15);
    }

    function playCrackSound(intensity) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      // High-frequency crystalline fracture snap
      const bufferSize = audioCtx.sampleRate * 0.09;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(2400, now);
      filter.Q.setValueAtTime(3.0, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(Math.min(0.5, intensity / 25), now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);
    }

    // ---------------------------------------------------------
    // 3. SOFT-BODY PHYSICS BALL & VERTEX RING
    // ---------------------------------------------------------
    const BASE_RADIUS = Math.min(W, H) < 600 ? 115 : 150;
    const NUM_NODES = RING_TEXT.length;

    const ball = {
      x: W * 0.32,
      y: H * 0.68,
      vx: 6.5,
      vy: -5.2,
      radius: BASE_RADIUS,
      angle: -0.6,
      omega: 0.014, // Angular velocity
      isDragging: false,
      dragOffsetX: 0,
      dragOffsetY: 0,
      lastCooldown: 0,
      nodes: []
    };

    // Initialize perimeter spring nodes (1 node per character)
    for (let i = 0; i < NUM_NODES; i++) {
      ball.nodes.push({
        rOffset: 0,   // Radial indentation/bulge from BASE_RADIUS
        rVel: 0,      // Radial velocity
        char: RING_TEXT[i]
      });
    }

    // ---------------------------------------------------------
    // 4. VIEWPORT EDGE CRACKS & SHARDS SYSTEM
    // ---------------------------------------------------------
    const cracks = [];
    const shards = [];
    let screenShake = 0;

    function spawnFrameCrack(x, y, normalX, normalY, impactForce) {
      playCrackSound(impactForce);
      screenShake = Math.min(12, impactForce * 0.45);

      const branchCount = 3 + Math.floor(Math.random() * 4);
      const baseAngle = Math.atan2(normalY, normalX);
      const branches = [];

      for (let b = 0; b < branchCount; b++) {
        const spread = (Math.random() - 0.5) * 1.45;
        let curAngle = baseAngle + spread;
        let cx = x;
        let cy = y;
        const pts = [{ x: cx, y: cy }];
        const segments = 4 + Math.floor(Math.random() * 6);
        const segLen = (8 + Math.random() * 14) * Math.min(2.2, impactForce / 12);

        for (let s = 0; s < segments; s++) {
          curAngle += (Math.random() - 0.5) * 0.55;
          cx += Math.cos(curAngle) * segLen;
          cy += Math.sin(curAngle) * segLen;
          pts.push({ x: cx, y: cy });

          // Sub-fork
          if (Math.random() < 0.35 && s > 1) {
            const subPts = [{ x: cx, y: cy }];
            let subAngle = curAngle + (Math.random() > 0.5 ? 0.5 : -0.5);
            let sx = cx, sy = cy;
            for (let k = 0; k < 3; k++) {
              sx += Math.cos(subAngle) * (segLen * 0.65);
              sy += Math.sin(subAngle) * (segLen * 0.65);
              subPts.push({ x: sx, y: sy });
            }
            branches.push({ pts: subPts, width: 1 });
          }
        }
        branches.push({ pts, width: 1.6 });
      }

      cracks.push({
        x, y,
        branches,
        alpha: 0.95,
        createdAt: performance.now()
      });

      // Cap total cracks so canvas stays crisp
      if (cracks.length > 24) cracks.shift();

      // Spawn flying glass/frame splinters
      const shardCount = Math.min(14, Math.floor(impactForce * 0.7));
      for (let i = 0; i < shardCount; i++) {
        const a = baseAngle + (Math.random() - 0.5) * 1.6;
        const spd = 2 + Math.random() * (impactForce * 0.45);
        shards.push({
          x, y,
          vx: Math.cos(a) * spd,
          vy: Math.sin(a) * spd,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.25,
          size: 3 + Math.random() * 5,
          life: 1.0
        });
      }
    }

    // ---------------------------------------------------------
    // 5. POINTER / DRAG / FLICK / HOLD-INDENT INTERACTION
    // ---------------------------------------------------------
    const pointer = {
      x: W * 0.5,
      y: H * 0.5,
      px: W * 0.5,
      py: H * 0.5,
      vx: 0,
      vy: 0,
      down: false
    };

    window.addEventListener('pointerdown', (e) => {
      pointer.down = true;
      pointer.x = pointer.px = e.clientX;
      pointer.y = pointer.py = e.clientY;

      const dist = Math.hypot(pointer.x - ball.x, pointer.y - ball.y);
      if (dist <= ball.radius * 1.25) {
        ball.isDragging = true;
        ball.dragOffsetX = ball.x - pointer.x;
        ball.dragOffsetY = ball.y - pointer.y;
        document.body.classList.add('dragging');
      }
    });

    window.addEventListener('pointermove', (e) => {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
    });

    window.addEventListener('pointerup', () => {
      pointer.down = false;
      if (ball.isDragging) {
        ball.isDragging = false;
        document.body.classList.remove('dragging');
        // Transfer flick momentum
        ball.vx = Math.max(-34, Math.min(34, pointer.vx * 0.85));
        ball.vy = Math.max(-34, Math.min(34, pointer.vy * 0.85));
      }
    });

    // ---------------------------------------------------------
    // 6. SOFT-BODY INDENTATION & EDGE PHYSICS STEP
    // ---------------------------------------------------------
    function updatePhysics(now) {
      // Track pointer velocity for flicking & cursor-brush indentation
      pointer.vx = pointer.x - pointer.px;
      pointer.vy = pointer.y - pointer.py;
      pointer.px = pointer.x;
      pointer.py = pointer.y;

      if (ball.isDragging) {
        // Follow cursor smoothly; allow user to push ball into/past the viewport frame
        const targetX = pointer.x + ball.dragOffsetX;
        const targetY = pointer.y + ball.dragOffsetY;
        ball.vx = (targetX - ball.x) * 0.35;
        ball.vy = (targetY - ball.y) * 0.35;
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Slight rotational torque while dragging near walls
        ball.omega *= 0.95;
      } else {
        // Free-flight edge-to-edge motion
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Keep a lively minimum cruise speed so it perpetually roams edge to edge
        const speed = Math.hypot(ball.vx, ball.vy);
        const minCruise = 4.2;
        if (speed > 0.01 && speed < minCruise) {
          ball.vx = (ball.vx / speed) * minCruise;
          ball.vy = (ball.vy / speed) * minCruise;
        } else if (speed > minCruise) {
          ball.vx *= 0.9985;
          ball.vy *= 0.9985;
        }

        // Wall Bounces + Rotational Spin Transfer + Frame Cracking
        const hitCooldownPassed = (now - ball.lastCooldown) > 90;

        // Left Frame
        if (ball.x - ball.radius < 0) {
          const pen = ball.radius - ball.x;
          if (ball.vx < 0) {
            const impact = Math.abs(ball.vx);
            ball.vx = Math.abs(ball.vx) * 0.94;
            ball.omega = (ball.vy * 0.0018);
            if (hitCooldownPassed) {
              playBounceSound(impact);
              if (impact > 9.5 || pen > 18) spawnFrameCrack(0, Math.max(20, Math.min(H - 20, ball.y)), 1, 0, impact);
              ball.lastCooldown = now;
            }
          }
          ball.x = ball.radius - pen * 0.35;
        }
        // Right Frame
        else if (ball.x + ball.radius > W) {
          const pen = (ball.x + ball.radius) - W;
          if (ball.vx > 0) {
            const impact = Math.abs(ball.vx);
            ball.vx = -Math.abs(ball.vx) * 0.94;
            ball.omega = -(ball.vy * 0.0018);
            if (hitCooldownPassed) {
              playBounceSound(impact);
              if (impact > 9.5 || pen > 18) spawnFrameCrack(W, Math.max(20, Math.min(H - 20, ball.y)), -1, 0, impact);
              ball.lastCooldown = now;
            }
          }
          ball.x = W - ball.radius + pen * 0.35;
        }

        // Top Frame
        if (ball.y - ball.radius < 0) {
          const pen = ball.radius - ball.y;
          if (ball.vy < 0) {
            const impact = Math.abs(ball.vy);
            ball.vy = Math.abs(ball.vy) * 0.94;
            ball.omega = -(ball.vx * 0.0018);
            if (hitCooldownPassed) {
              playBounceSound(impact);
              if (impact > 9.5 || pen > 18) spawnFrameCrack(Math.max(20, Math.min(W - 20, ball.x)), 0, 0, 1, impact);
              ball.lastCooldown = now;
            }
          }
          ball.y = ball.radius - pen * 0.35;
        }
        // Bottom Frame
        else if (ball.y + ball.radius > H) {
          const pen = (ball.y + ball.radius) - H;
          if (ball.vy > 0) {
            const impact = Math.abs(ball.vy);
            ball.vy = -Math.abs(ball.vy) * 0.94;
            ball.omega = (ball.vx * 0.0018);
            if (hitCooldownPassed) {
              playBounceSound(impact);
              if (impact > 9.5 || pen > 18) spawnFrameCrack(Math.max(20, Math.min(W - 20, ball.x)), H, 0, -1, impact);
              ball.lastCooldown = now;
            }
          }
          ball.y = H - ball.radius + pen * 0.35;
        }
      }

      // Advance ring rotation
      ball.angle += ball.omega;

      // ---------------------------------------------------------
      // PER-CHARACTER SOFT-BODY INDENTATION SOLVER
      // ---------------------------------------------------------
      let totalIndentation = 0;

      for (let i = 0; i < NUM_NODES; i++) {
        const node = ball.nodes[i];
        const theta = ball.angle + (i / NUM_NODES) * Math.PI * 2;
        const cosT = Math.cos(theta);
        const sinT = Math.sin(theta);

        // Ideal un-deformed world position of this letter
        const idealR = ball.radius;
        const wx = ball.x + cosT * (idealR + node.rOffset);
        const wy = ball.y + sinT * (idealR + node.rOffset);

        // 1. Check constraint against the 4 viewport walls (indents when held/pressed over frame)
        const margin = 8;
        let requiredR = idealR + node.rOffset;

        if (wx < margin && cosT < -0.05) {
          requiredR = Math.min(requiredR, (margin - ball.x) / cosT);
        }
        if (wx > W - margin && cosT > 0.05) {
          requiredR = Math.min(requiredR, (W - margin - ball.x) / cosT);
        }
        if (wy < margin && sinT < -0.05) {
          requiredR = Math.min(requiredR, (margin - ball.y) / sinT);
        }
        if (wy > H - margin && sinT > 0.05) {
          requiredR = Math.min(requiredR, (H - margin - ball.y) / sinT);
        }

        // Clamp maximum inward crush so ring stays legible
        const minAllowedR = ball.radius * 0.38;
        requiredR = Math.max(minAllowedR, requiredR);

        if (requiredR < idealR + node.rOffset) {
          const crush = (idealR + node.rOffset) - requiredR;
          node.rOffset = requiredR - idealR;
          node.rVel *= 0.4;
          totalIndentation += crush;

          // If user forcefully crushes the ball deep into the frame while dragging, fracture the edge
          if (ball.isDragging && crush > 8 && Math.random() < 0.035 && (now - ball.lastCooldown > 180)) {
            const cx = Math.max(0, Math.min(W, wx));
            const cy = Math.max(0, Math.min(H, wy));
            const nx = wx < margin ? 1 : (wx > W - margin ? -1 : 0);
            const ny = wy < margin ? 1 : (wy > H - margin ? -1 : 0);
            if (nx !== 0 || ny !== 0) {
              spawnFrameCrack(cx, cy, nx, ny, 14);
              ball.lastCooldown = now;
            }
          }
        }

        // 2. Cursor hover/poke indentation on individual letters when not dragging
        if (!ball.isDragging) {
          const dx = wx - pointer.x;
          const dy = wy - pointer.y;
          const distToCursor = Math.hypot(dx, dy);
          const pokeRadius = 38;
          if (distToCursor < pokeRadius) {
            const push = (1 - distToCursor / pokeRadius) * -14;
            node.rVel += push * 0.18;
          }
        }

        // 3. Hooke's Law radial spring restoration
        const springK = 0.16;
        const damping = 0.80;
        node.rVel += (-node.rOffset * springK);
        node.rVel *= damping;
        node.rOffset += node.rVel;
      }

      // Volume conservation: when one side indents against the frame, adjacent sides bulge outward
      const avgBulge = Math.min(28, (totalIndentation / NUM_NODES) * 0.65);
      for (let i = 0; i < NUM_NODES; i++) {
        const prev = ball.nodes[(i - 1 + NUM_NODES) % NUM_NODES];
        const next = ball.nodes[(i + 1) % NUM_NODES];
        const curr = ball.nodes[i];

        // Neighbor coupling smooths the curve of the text ring
        const neighborAvg = (prev.rOffset + next.rOffset) * 0.5;
        curr.rVel += (neighborAvg - curr.rOffset) * 0.28;
        if (curr.rOffset >= -1) {
          curr.rOffset += avgBulge * 0.08;
        }
      }
    }

    // ---------------------------------------------------------
    // 7. RENDER LOOP (CRACKS, SHARDS & DEFORMABLE TEXT RING)
    // ---------------------------------------------------------
    function render(now) {
      updatePhysics(now);

      ctx.save();

      // Subtle camera shake on heavy wall impact
      if (screenShake > 0.2) {
        const sx = (Math.random() - 0.5) * screenShake;
        const sy = (Math.random() - 0.5) * screenShake;
        ctx.translate(sx, sy);
        screenShake *= 0.82;
      }

      ctx.clearRect(-20, -20, W + 40, H + 40);

      // 1. Render Viewport Frame Cracks
      for (let i = cracks.length - 1; i >= 0; i--) {
        const c = cracks[i];
        const age = (now - c.createdAt) / 1000;
        // Slowly heal cracks after 12 seconds
        if (age > 12) {
          c.alpha -= 0.008;
          if (c.alpha <= 0) {
            cracks.splice(i, 1);
            continue;
          }
        }

        ctx.save();
        ctx.strokeStyle = `rgba(255, 255, 255, ${c.alpha * 0.85})`;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        for (const b of c.branches) {
          ctx.lineWidth = b.width;
          ctx.beginPath();
          ctx.moveTo(b.pts[0].x, b.pts[0].y);
          for (let p = 1; p < b.pts.length; p++) {
            ctx.lineTo(b.pts[p].x, b.pts[p].y);
          }
          ctx.stroke();
        }
        ctx.restore();
      }

      // 2. Render Flying Impact Shards
      for (let i = shards.length - 1; i >= 0; i--) {
        const s = shards[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.18; // Gravity
        s.rot += s.vRot;
        s.life -= 0.024;

        if (s.life <= 0) {
          shards.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rot);
        ctx.fillStyle = `rgba(255, 255, 255, ${s.life})`;
        ctx.beginPath();
        ctx.moveTo(-s.size, -s.size * 0.5);
        ctx.lineTo(s.size, 0);
        ctx.lineTo(-s.size * 0.4, s.size);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // 3. Compute World Positions of Every Character on the Deformed Perimeter
      const pts = [];
      for (let i = 0; i < NUM_NODES; i++) {
        const theta = ball.angle + (i / NUM_NODES) * Math.PI * 2;
        const r = ball.radius + ball.nodes[i].rOffset;
        pts.push({
          x: ball.x + Math.cos(theta) * r,
          y: ball.y + Math.sin(theta) * r,
          char: ball.nodes[i].char
        });
      }

      // 4. Render Each Character Along the Local Tangent of the Deformed Curve
      const fontSize = Math.min(W, H) < 600 ? 15 : 19;
      ctx.font = `500 ${fontSize}px -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", sans-serif`;
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < NUM_NODES; i++) {
        const curr = pts[i];
        const prev = pts[(i - 1 + NUM_NODES) % NUM_NODES];
        const next = pts[(i + 1) % NUM_NODES];

        // Tangent angle follows the actual squashed/indented contour
        const tangentAngle = Math.atan2(next.y - prev.y, next.x - prev.x);

        ctx.save();
        ctx.translate(curr.x, curr.y);
        ctx.rotate(tangentAngle);
        ctx.fillText(curr.char, 0, 0);
        ctx.restore();
      }

      ctx.restore();
      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
